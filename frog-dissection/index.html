<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frog Dissection Lab</title>
<style>
:root{
  --navy:#0B1630; --ink:#1B2333; --card:#EEF2F8; --cream:#FFF4E3;
  --amber:#F4A43A; --amberDk:#B86F0E; --teal:#2A9D8F; --coral:#E4572E;
  --blue:#2F6FDE; --purple:#7B5EA7; --grey:#6B7486; --line:#D5DCE8; --muted:#6B7486;
  --bg:#fff; --surface:#fff; --on-navy:#fff; --header:#0B1630;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:15px}
h1,h2{font-family:Cambria,Caladea,Georgia,"Times New Roman",serif}
body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{flex:none;background:var(--header);color:#fff;padding:6px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:24px 24px}
header .kicker{font-size:12px;letter-spacing:.12em;color:var(--amber);font-weight:700}
header h1{margin:0;font-size:21px;font-weight:700;white-space:nowrap}
.ctrls{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctl{display:flex;align-items:center;gap:6px;font-size:13px;color:#C9D2E3;font-weight:700}
.ctl select{font:inherit;font-size:13px;font-weight:400;padding:3px 6px;border-radius:7px;border:1px solid rgba(255,255,255,.3);background:#18243F;color:#fff}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.3);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:700;border:0;background:transparent;color:#C9D2E3;padding:4px 9px;cursor:pointer}
.seg button.on{background:var(--amber);color:#0B1630}
.seg button:focus-visible,.ctl select:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.22fr) minmax(330px,.78fr);gap:8px;padding:8px 10px 10px}
.left{display:flex;flex-direction:column;min-height:0;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.tabs{flex:none;display:flex;gap:2px;padding:5px 6px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{font:inherit;font-weight:700;font-size:14px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;padding:5px 12px;background:transparent;color:var(--grey);cursor:pointer;white-space:nowrap}
.tab .n{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:50%;background:var(--card);color:var(--ink);font-size:11px;text-align:center;margin-right:5px}
.tab.on{background:var(--cream);color:var(--ink);border-color:var(--line)}
.tab.on .n{background:var(--amber);color:#0B1630}
.tab.done .n{background:var(--teal);color:#fff}
.work{flex:1;min-height:0;display:flex}
.tools{flex:none;width:74px;display:flex;flex-direction:column;gap:3px;padding:5px;border-right:1px solid var(--line);overflow-y:auto}
.tool{font:inherit;display:flex;flex-direction:column;align-items:center;gap:0;font-size:11px;font-weight:700;line-height:1.1;padding:3px 2px;border:2px solid transparent;border-radius:9px;background:var(--card);color:var(--ink);cursor:pointer}
.tool svg{width:34px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool.on{border-color:var(--amber);background:var(--cream)}
.tool:focus-visible{outline:3px solid var(--amber)}
.tools .sep{height:1px;background:var(--line);margin:3px 0}
.tools .chk{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;cursor:pointer;justify-content:center}
.tools .flip{font:inherit;font-size:11px;font-weight:700;border:2px solid var(--navy);color:var(--navy);background:var(--surface);border-radius:9px;padding:4px 2px;cursor:pointer}
.trayWrap{flex:1;min-width:0;position:relative;background:var(--card)}
#tray{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#tray.cross{cursor:crosshair}
.banner{position:absolute;left:50%;top:8px;transform:translateX(-50%);max-width:min(560px,92%);padding:6px 12px;border-radius:10px;font-size:14px;line-height:1.3;text-align:center;display:none;border:2px solid;z-index:3;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.banner.ok{background:#E4F4F1;border-color:var(--teal);color:#14564E}
.banner.bad{background:#FCE9E3;border-color:var(--coral);color:#8A2A10}
.banner.info{background:#FFF4E3;border-color:var(--amber);color:#6B4206}
.right{display:grid;grid-template-rows:minmax(0,1.08fr) minmax(0,1fr);gap:8px;min-height:0;min-width:0}
.card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 12px;min-height:0;display:flex;flex-direction:column}
.card h2{margin:0;font-size:17px}
.procHead{display:flex;align-items:baseline;gap:8px}
.procHead .cnt{margin-left:auto;font-size:12px;color:var(--grey);font-weight:700;white-space:nowrap}
#procText{font-size:14.5px;line-height:1.35;margin-top:3px}
#procText .why{font-size:13px;color:var(--grey);margin-top:3px}
#procText .tooltag{display:inline-block;font-size:12px;font-weight:700;background:var(--cream);border:1px solid var(--amber);border-radius:6px;padding:0 6px;margin-right:4px;color:var(--ink)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.btn{font:inherit;font-size:13px;font-weight:700;border-radius:8px;border:2px solid var(--navy);background:var(--surface);color:var(--navy);padding:2px 10px;cursor:pointer}
.btn.go{background:var(--navy);color:var(--on-navy)}
.btn:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
.btn.sm{font-size:12px;padding:1px 8px;border-width:1px}
.info{flex:1;min-height:0;overflow-y:auto;border-top:1px solid var(--line);margin-top:6px;padding-top:5px}
.info h3{margin:0;font-family:Cambria,Georgia,serif;font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:11px;font-weight:700;border-radius:20px;padding:1px 8px;border:1.5px solid;letter-spacing:.03em}
.info p{margin:4px 0;font-size:14.5px;line-height:1.38}
.info p.lv{border-left:3px solid var(--amber);padding-left:7px}
.info p.lv12{border-left-color:var(--purple)}
.info .muted{color:var(--grey);font-size:14px}
.cuHead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cuHead .mag{font-size:12px;font-weight:700;color:var(--grey)}
.cuHead .views{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.cuHead .views .btn.on{background:var(--amber);border-color:var(--amber);color:#0B1630}
.cuBox{flex:1;min-height:0;position:relative;margin-top:5px;border-radius:10px;overflow:hidden;background:#151210}
#cu{position:absolute;inset:0;width:100%;height:100%}
.cuNote{position:absolute;left:8px;bottom:6px;right:8px;color:#E8DFD2;font-size:12.5px;text-shadow:0 1px 2px #000;pointer-events:none}
.dish{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:5px;min-height:24px}
.dish .lbl{font-size:12px;font-weight:700;color:var(--grey)}
.dish .btn.on{background:var(--amber);border-color:var(--amber);color:#0B1630}
.dish .empty{font-size:12px;color:var(--grey)}
/* tray graphics */
#tray text,#cu text{font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif}
.lab text{font-size:var(--lf,13.5px);font-weight:700;fill:#fff;stroke:rgba(10,8,6,.85);stroke-width:var(--ls,3.2px);paint-order:stroke;stroke-linejoin:round}
.lab line,.lab path{stroke:#fff;stroke-width:1.2;fill:none;opacity:.9}
.lab circle{fill:#ffd23a;stroke:#000;stroke-width:.8}
.lab.sel text{fill:#ffd23a}
.org{filter:url(#fWet) drop-shadow(1px 2px 1.5px rgba(0,0,0,.45))}
.bone{filter:url(#fBone) drop-shadow(1px 2px 2px rgba(0,0,0,.55))}
[data-id]{cursor:pointer}
.hov{filter:drop-shadow(0 0 2px #fff4a8) drop-shadow(0 0 4px #ffd23a) !important}
.org.hov{filter:url(#fWet) drop-shadow(0 0 2px #fff4a8) drop-shadow(0 0 4px #ffd23a) !important}
.bone.hov{filter:url(#fBone) drop-shadow(0 0 2px #fff4a8) drop-shadow(0 0 4px #ffd23a) !important}
.tex.hov{filter:url(#fSkin) drop-shadow(0 0 2px #fff4a8) drop-shadow(0 0 4px #ffd23a) !important}
.sel{filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 4px #ffb300) !important}
.org.sel{filter:url(#fWet) drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 4px #ffb300) !important}
.bone.sel{filter:url(#fBone) drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 4px #ffb300) !important}
.tex.sel{filter:url(#fSkin) drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 4px #ffb300) !important}
html.soft .org,html.soft .tex,html.soft .bone{filter:drop-shadow(1px 2px 1.5px rgba(0,0,0,.3)) !important}
html.soft .hov{filter:drop-shadow(0 0 2px #fff4a8) drop-shadow(0 0 4px #ffd23a) !important}
html.soft .sel{filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 4px #ffb300) !important}
html.soft .gore{display:none}
html.soft .noise{display:none}
.pulse{fill:none;stroke:#ffd23a;stroke-width:2.5;stroke-dasharray:6 5;animation:spin 1.2s linear infinite}
.pulseFill{fill:rgba(255,210,58,.18);animation:breathe 1.2s ease-in-out infinite}
.cutGuide{fill:none;stroke:#ffd23a;stroke-width:2.2;stroke-dasharray:7 6;animation:spin 1s linear infinite}
.cutGuide.faint{stroke-opacity:.45;animation:none}
@keyframes spin{to{stroke-dashoffset:-22}}
@keyframes breathe{50%{fill:rgba(255,210,58,.38)}}
@media (prefers-reduced-motion: reduce){.pulse,.cutGuide,.pulseFill{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* small screens: allow scrolling */
@media (max-width:900px), (max-height:500px){
  body{height:auto;overflow:auto}
  main{grid-template-columns:1fr}
  .left{height:80vh;min-height:420px}
  .right{grid-template-rows:auto 60vh}
  .info{max-height:260px}
}
/* light/dark switch, top-right corner. Remembers the choice; until then it follows the computer's setting. */
</style>
</head>
<body>
<header>
  <span class="kicker">SNC2D · TISSUES, ORGANS &amp; SYSTEMS</span>
  <h1>Frog Dissection Lab</h1>
  <div class="ctrls">
    <label class="ctl" id="sexWrap">Specimen
      <select id="sex"><option value="m">Male frog</option><option value="f">Female frog</option></select></label>
    <div class="seg" id="modeSeg" role="group" aria-label="Mode"><button data-v="guided" class="on">Guided</button><button data-v="own">On my own</button></div>
  </div>
</header>
<main>
  <section class="left">
    <nav class="tabs" id="tabs" aria-label="Parts of the dissection"></nav>
    <div class="work">
      <div class="tools" id="tools" aria-label="Dissecting tools"></div>
      <div class="trayWrap">
        <svg id="tray" viewBox="0 0 760 700" preserveAspectRatio="xMidYMid meet" aria-label="Dissecting tray">
          <defs id="defs"></defs>
          <g id="scene"></g>
          <g id="marks"></g>
          <g id="labels" class="lab"></g>
          <g id="ghost" pointer-events="none"></g>
        </svg>
        <div id="banner" class="banner" role="status" aria-live="polite"></div>
      </div>
    </div>
  </section>
  <section class="right">
    <div class="card" id="procCard">
      <div class="procHead"><h2 id="procTitle">Procedure</h2><span class="cnt" id="procCnt"></span></div>
      <div id="procText"></div>
      <div class="btnrow" id="procBtns"></div>
      <div class="info" id="info" aria-live="polite"></div>
    </div>
    <div class="card" id="cuCard">
      <div class="cuHead"><h2 id="cuTitle">Close-up</h2><span class="mag" id="cuMag"></span><div class="views" id="cuViews"></div></div>
      <div class="cuBox"><svg id="cu" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" aria-label="Close-up view"></svg><div class="cuNote" id="cuNote"></div></div>
      <div class="dish" id="dish"></div>
    </div>
  </section>
</main>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const CX=380;
let OY=0;
const P=(dx,y)=>[CX+dx,y+OY];
const n1=v=>(Math.round(v*10)/10);
const pt=p=>n1(p[0])+','+n1(p[1]);
const H=(s,a)=>a.map(([dx,y])=>P(s*dx,y));
function crC(p){let d='';const n=p.length;for(let i=0;i<n-1;i++){const a=p[Math.max(0,i-1)],b=p[i],c=p[i+1],e=p[Math.min(n-1,i+2)];
  d+='C'+pt([b[0]+(c[0]-a[0])/6,b[1]+(c[1]-a[1])/6])+' '+pt([c[0]-(e[0]-b[0])/6,c[1]-(e[1]-b[1])/6])+' '+pt(c);}return d;}
const open=p=>'M'+pt(p[0])+crC(p);
function closed(p){const n=p.length;let d='M'+pt(p[0]);for(let i=0;i<n;i++){const a=p[(i-1+n)%n],b=p[i],c=p[(i+1)%n],e=p[(i+2)%n];
  d+='C'+pt([b[0]+(c[0]-a[0])/6,b[1]+(c[1]-a[1])/6])+' '+pt([c[0]-(e[0]-b[0])/6,c[1]-(e[1]-b[1])/6])+' '+pt(c);}return d+'Z';}
function sym(half){const R=half.map(([dx,y])=>P(dx,y)),L=half.slice(1,-1).reverse().map(([dx,y])=>P(-dx,y));return closed(R.concat(L));}
function tubePts(c,w){const L=[],R=[];for(let i=0;i<c.length;i++){const a=c[Math.max(0,i-1)],b=c[Math.min(c.length-1,i+1)];
  let tx=b[0]-a[0],ty=b[1]-a[1];const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;const h=w[i]/2;L.push([c[i][0]-ty*h,c[i][1]+tx*h]);R.push([c[i][0]+ty*h,c[i][1]-tx*h]);}
  return L.concat(R.reverse());}
const tube=(c,w)=>closed(tubePts(c,w));
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function bone(a,b,w){const m=lerp(a,b,.5),q1=lerp(a,b,.14),q2=lerp(a,b,.86);return tube([a,q1,m,q2,b],[w*1.75,w*1.02,w*.92,w*1.02,w*1.75]);}
const at=(id,o='')=>` data-id="${id}"${o}`;

/* ---------------- palette (realistic / softened) ---------------- */
const PAL={
 wax:['#3b342e','#1b1714','#5b544e','#3e3833'],metal:['#eceff2','#9aa1aa','#eceff2','#9aa1aa'],
 skinD:['#8a9858','#46512c','#adb68d','#828c69'],skinV:['#f3ecd5','#c9ba92','#f5f0e2','#dad1b8'],
 skinIn:['#e2ab99','#a2625a','#f2d5ca','#d2aa9e'],muscle:['#dba18d','#93584a','#f0d2c4','#d0a796'],
 cavity:['#5a3c35','#1f1416','#cfbab0','#a28d83'],liver:['#9c5139','#481f16','#d3a891','#a47d68'],
 heartV:['#ad463b','#561914','#e8b3ac','#c08881'],heartA:['#7d5079','#36203c','#cfbadb','#a691b7'],
 artery:['#e4493c','#8a1c15','#f3aca5','#cd817a'],vein:['#5f84d6','#233f8a','#b6c6eb','#8498cb'],
 lung:['#e0b0a6','#965f59','#f5dad7','#d2aeab'],stomach:['#f1e3c8','#ae936d','#f6eddb','#d8c5a8'],
 gut:['#eedcbd','#a98a62','#f5e9d4','#d4be9e'],fat:['#f8d257','#c58318','#f8e4a2','#ddbd6e'],
 spleen:['#ad3c4e','#561524','#ddacb6','#b5828e'],kidney:['#9e4336','#4a170f','#dbaea2','#ae8176'],
 testis:['#f6eaae','#c3a553','#f8f0cb','#d9c690'],ovary:['#4c423c','#14100e','#a59b94','#7d736d'],
 oviduct:['#f7f3eb','#c3b7a2','#f9f6f0','#dad1c2'],bladder:['#f1ebe0','#b5a993','#f6f2e9','#d7cdbb'],
 gall:['#8ab454','#3a5c1c','#c6dca6','#95af76'],pancreas:['#f5e8cb','#c4a982','#f8efde','#d9c7a8'],
 brain:['#ecdcd0','#b08e7e','#f7ece2','#d8c1b0'],bone:['#f9f3e3','#c4b088','#f9f3e3','#d6c8a8'],
 oral:['#f0c2b1','#b07262','#f6dcd1','#d5ad9e'],tongue:['#f1b8a6','#a96253','#f7d5ca','#d1a194'],
 iris:['#d0ae62','#4a3512','#dac590','#8f7646'],mening:['#5a4840','#1c1512','#b5a79f','#8d7f77'],
 adrenal:['#f6b04a','#c0660a','#f8d59e','#dba966'],sternum:['#f6f3e9','#cbc1a8','#f6f3e9','#cbc1a8']
};
(()=>{let a=':root{',b='html.soft{';for(const k in PAL){a+=`--${k}1:${PAL[k][0]};--${k}2:${PAL[k][1]};`;b+=`--${k}1:${PAL[k][2]};--${k}2:${PAL[k][3]};`;}
 const st=document.createElement('style');st.textContent=a+'}'+b+'}';document.head.appendChild(st);})();

/* ---------------- shared SVG defs: gradients, textures, lighting ---------------- */
(()=>{let d='';
 for(const k in PAL){d+=`<radialGradient id="r-${k}" cx=".36" cy=".3" r=".8"><stop offset="0" style="stop-color:var(--${k}1)"/><stop offset="1" style="stop-color:var(--${k}2)"/></radialGradient>`;
   d+=`<linearGradient id="l-${k}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--${k}1)"/><stop offset="1" style="stop-color:var(--${k}2)"/></linearGradient>`;}
 d+=`<radialGradient id="eyeG" cx=".42" cy=".38" r=".7"><stop offset="0" style="stop-color:var(--iris1)"/><stop offset=".8" style="stop-color:var(--iris2)"/><stop offset="1" stop-color="#111"/></radialGradient>
 <radialGradient id="egg" cx=".4" cy=".3" r=".75"><stop offset="0" stop-color="#5a524c"/><stop offset=".5" stop-color="#1c1714"/><stop offset=".56" stop-color="#2c2622"/><stop offset=".62" stop-color="#e9dfc3"/><stop offset="1" stop-color="#b9a983"/></radialGradient>
 <linearGradient id="eggL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a332e"/><stop offset=".5" stop-color="#14100e"/><stop offset=".54" stop-color="#d9cdb0"/><stop offset="1" stop-color="#f3ead2"/></linearGradient>
 <radialGradient id="shine" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <linearGradient id="metalRim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset=".45" stop-color="#b7bec7"/><stop offset=".55" stop-color="#d9dde2"/><stop offset="1" stop-color="#8d949d"/></linearGradient>
 <radialGradient id="waxG" cx=".45" cy=".4" r=".75"><stop offset="0" style="stop-color:var(--wax1)"/><stop offset="1" style="stop-color:var(--wax2)"/></radialGradient>
 <radialGradient id="cavG" cx=".5" cy=".45" r=".6"><stop offset="0" style="stop-color:var(--cavity1)"/><stop offset="1" style="stop-color:var(--cavity2)"/></radialGradient>
 <pattern id="fib" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 2.5h5" stroke="#5a2a20" stroke-opacity=".22" stroke-width="1"/></pattern>
 <pattern id="fibV" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M2 0v4" stroke="#5a2a20" stroke-opacity=".22" stroke-width="1"/></pattern>

// id: [name, system, min level, all levels, Grade 11+, Grade 12]
const SYS={Digestive:'#E4572E',Respiratory:'#2F6FDE',Circulatory:'#C0392B',Excretory:'#B8860B',Reproductive:'#7B5EA7',Nervous:'#2A9D8F',Skeletal:'#6B7486',Muscular:'#C0602A',Integumentary:'#4F7A28',Sensory:'#0E7C86',Endocrine:'#C2185B',Immune:'#8E44AD'};
const INFO={
 ext_skin:['Skin (dorsal side)','Integumentary',10,'The skin is thin, moist and full of mucus glands. The olive colour and dark blotches camouflage the frog among water plants.','Frogs take in oxygen and give off carbon dioxide through their moist skin (cutaneous respiration), so the skin works with the lungs as a breathing surface.','Water also moves easily through frog skin, so frogs must stay near water to keep their water balance. Mucus slows drying, and frogs absorb water through the skin instead of drinking.'],
 ext_vskin:['Skin (ventral side)','Integumentary',10,'The belly skin is pale. Animals that are dark on top and light underneath (countershading) are harder for predators to see from above or below.','Like the back, the belly skin is a breathing surface. A thin, moist, well-supplied surface is what every gas exchange organ needs.','Many frogs have a patch of thin, highly folded skin on the lower belly (a "seat patch") that soaks up water from damp ground, helping to keep the body\'s water balance.'],
 ext_eye:['Eye','Sensory',10,'The large eyes sit high on the head, so the frog can see above the water while the rest of its body stays hidden.','A clear third eyelid, the nictitating membrane, slides up from below to protect the eye underwater and keep it moist on land.','When it swallows, the frog pulls its eyes down into the head. The eyeballs press on the roof of the mouth and help push food toward the esophagus.'],
 ext_nares:['External nares (nostrils)','Respiratory',10,'The two nostrils let air in. They lead to openings in the roof of the mouth called the internal nares.','Frogs breathe by raising and lowering the floor of the mouth, pushing air through the nostrils into the lungs (positive-pressure breathing). Humans pull air in by lowering the diaphragm instead.',''],
 ext_tympanum:['Tympanum (eardrum)','Sensory',10,'The tympanum is the round disc behind the eye. It vibrates when sound waves hit it.','In some species, such as bullfrogs, the male\'s tympanum is larger than his eye, while the female\'s is about the same size as the eye.','Vibrations pass through a small bone (the columella) to the inner ear, which also senses balance and body position.'],
 ext_dlfold:['Dorsolateral fold','Integumentary',10,'A raised ridge of skin that runs down each side of the back.','These folds help scientists identify species: leopard frogs have them, but bullfrogs do not.',''],
 ext_sacral:['Sacral hump','Skeletal',11,'The bump in the lower back is where the hip bones join the backbone.','It marks where the force of the jumping legs is passed to the spine. You will see the bones that form it in the Skeleton view.',''],
 ext_forelimb:['Front leg (forelimb)','Skeletal',10,'The short front legs hold up the front of the body and absorb the shock of landing. Each hand has four fingers.','The forelimb has the same bone pattern as a human arm: one upper arm bone, a forearm, wrist, hand and finger bones. Structures like this are called homologous structures.',''],
 ext_hindlimb:['Hind leg (hindlimb)','Muscular',10,'The long, muscular hind legs power jumping and swimming.','The thigh, lower leg and an extra-long ankle make three sections that fold up like a spring and straighten all at once in a jump.',''],
 ext_web:['Webbed foot','Integumentary',10,'Five toes joined by webbing push against the water like a paddle.','Webbing increases the surface area of the foot, so each kick moves more water.',''],
 ext_thumb:['Thumb pad (male)','Reproductive',10,'A swollen, dark thumb pad shows that this frog is a male.','During mating the male clasps the female from behind (amplexus). The rough pads help him hold on while she lays her eggs.','The pads swell in the breeding season because of the hormone testosterone, made by the testes.'],
 ext_cloaca:['Cloaca opening','Excretory',10,'The cloaca opening is the single exit for the digestive, excretory and reproductive systems.','"Cloaca" comes from the Latin word for sewer. Humans have separate openings for these systems.',''],
 ext_mouth:['Mouth and jaws','Digestive',10,'The wide mouth opens far enough to swallow prey almost as big as the frog\'s head. Frogs swallow food whole.','',''],
 m_tongue:['Tongue','Digestive',10,'The sticky tongue is attached at the FRONT of the mouth, so it can flip out quickly to catch insects.','The free back end is forked. When the tongue flips out, this sticky end strikes the prey first and carries it back into the mouth.',''],
 m_maxteeth:['Maxillary teeth','Digestive',10,'Tiny teeth along the edge of the upper jaw. They hold prey; frogs do not chew.','The lower jaw has no teeth. Run a probe along both jaws and compare.',''],
 m_vomer:['Vomerine teeth','Digestive',10,'Two small patches of teeth on the roof of the mouth. They grip slippery prey so it cannot escape.','',''],
 m_inares:['Internal nares','Respiratory',10,'Openings in the roof of the mouth that connect to the nostrils. Air passes through them on its way to the lungs.','Push a probe gently into a nostril from outside and it comes out here.',''],
 m_eust:['Eustachian tube opening','Sensory',10,'An opening at the back corner of the mouth that leads to the ear.','The Eustachian tubes balance the air pressure on both sides of the eardrum, the same job your own Eustachian tubes do when your ears "pop".',''],
 m_esoph:['Esophagus opening','Digestive',10,'The large, folded opening at the back of the throat. Swallowed food passes through it to the stomach.','The folds let the esophagus stretch to swallow large prey whole.',''],
 m_glottis:['Glottis','Respiratory',10,'A slit in the floor of the mouth, in front of the esophagus. It leads through the larynx to the lungs.','Frogs have no epiglottis. Instead the glottis closes tightly when the frog swallows, so food does not enter the lungs.','Muscles of the larynx open the glottis when the mouth floor pumps air into the lungs. In males, vocal cords in the larynx vibrate to make the mating call.'],
 m_eyebulge:['Eyeball bulges','Sensory',10,'These bulges are the bottoms of the eyeballs. The eye sockets have no bony floor.','When swallowing, the frog pulls its eyes down. They press on food and help push it toward the esophagus.',''],
 m_vocal:['Vocal sac openings (male)','Reproductive',10,'Small slits that lead to the vocal sacs. The sacs fill with air and make the male\'s call louder.','Calling attracts females of the same species, which keeps species from interbreeding.',''],
 m_hinge:['Jaw hinge (cut)','Skeletal',10,'The hinge of the jaw was cut on each side so the mouth would open wide enough to see inside.','',''],
 b_skinin:['Inside of the skin','Integumentary',10,'The underside of the skin is covered with blood vessels.','This dense network picks up oxygen through the skin. A frog resting underwater can get much of its oxygen this way.','The blood vessels in the skin also help with water balance, because frogs absorb water through their skin.'],
 b_pect:['Pectoral muscles','Muscular',10,'Chest muscles that move the front legs and help the frog land after a jump.','',''],
 b_rectus:['Rectus abdominis','Muscular',10,'Long muscles that run down the belly. They support the organs and bend the body.','The cross lines are tendinous inscriptions. They divide each muscle into segments, like a human "six-pack".',''],
 b_oblique:['External oblique muscle','Muscular',10,'Muscles on the sides of the body wall. They help squeeze air out of the lungs.','',''],
 b_linea:['Linea alba','Muscular',10,'A white line of connective tissue down the middle of the belly where the muscles of each side meet.','',''],
 b_abvein:['Ventral abdominal vein','Circulatory',10,'A vein running along the middle of the belly wall. Cutting slightly to one side keeps it whole.','It carries blood from the hind legs and belly toward the liver. In this specimen the veins were filled with blue latex and the arteries with red latex so they are easy to follow.','Blood from the hind legs and gut passes through the liver before returning to the heart, so the liver can adjust its glucose level and remove toxins first.'],
 b_sternum:['Sternum (breastbone)','Skeletal',10,'The sternum and shoulder girdle protect the heart and anchor the chest muscles. They must be cut to open the chest.','',''],
 b_heart:['Heart','Circulatory',10,'The heart pumps blood through the body. Frogs have a three-chambered heart: two atria and one ventricle.','Oxygen-rich and oxygen-poor blood partly mix in the single ventricle. Ridges in the ventricle and the spiral valve in the conus keep most of it separate.','A three-chambered heart meets the needs of an ectotherm with a low metabolic rate. Birds and mammals are endotherms and need the full separation of a four-chambered heart.'],
 b_ventricle:['Ventricle','Circulatory',10,'The thick, muscular lower chamber. It pumps blood out to the lungs, skin and body.','There is only one ventricle, so blood from the lungs and blood from the body partly mix. The spongy inner wall helps keep the two streams apart.','Ectotherms need less oxygen than endotherms, so some mixing is not a problem for a frog. Mammals and birds have two ventricles and no mixing.'],
 b_ratrium:['Right atrium','Circulatory',10,'The right atrium collects oxygen-poor blood returning from the body.','Blood enters it from the sinus venosus, a thin sac on the back of the heart. Blood from the skin, which carries oxygen, also returns here.',''],
 b_latrium:['Left atrium','Circulatory',10,'The left atrium collects oxygen-rich blood returning from the lungs.','The left atrium is smaller than the right because it receives blood from the lungs only.',''],
 b_conus:['Conus arteriosus and aortic arches','Circulatory',11,'The conus arteriosus carries blood out of the ventricle and splits into the aortic arches.','A spiral valve inside the conus steers oxygen-poor blood toward the lungs and skin and oxygen-rich blood toward the head and body.',''],
 b_liver:['Liver','Digestive',10,'The largest organ in the body cavity. It has three lobes and makes bile, which helps digest fats.','Bile is stored in the gallbladder, tucked between the lobes, and released into the small intestine.','The liver is a key organ of homeostasis: it stores glucose as glycogen, breaks down toxins, and turns toxic ammonia into urea.'],
 b_gall:['Gallbladder','Digestive',10,'A small green sac that stores bile made by the liver.','Bile flows through the bile duct into the duodenum, where it breaks fat into tiny droplets (emulsification) so enzymes can digest it.',''],
 b_lung:['Lung','Respiratory',10,'The two lungs are thin, stretchy sacs that fill with air. They look spongy because of many small pockets inside.','Frog lungs are simple compared to human lungs, which have millions of tiny alveoli. Frogs make up for this by also breathing through their skin and the lining of the mouth.','When the frog is active or the water is warm and low in oxygen, it relies more on its lungs. Resting in cold water, the skin can supply most of the oxygen it needs.'],
 b_esoph:['Esophagus','Digestive',10,'A short tube that carries food from the mouth to the stomach.','',''],
 b_stomach:['Stomach','Digestive',10,'A J-shaped muscular bag where food is stored and protein digestion begins.','Glands in the stomach wall release hydrochloric acid and the enzyme pepsin. The pyloric sphincter at the end controls when food moves into the small intestine.','Stretch receptors in the stomach wall send signals to the brain when it is full, one of the feedback signals that controls feeding.'],
 b_duod:['Duodenum','Digestive',11,'The first part of the small intestine. Bile and pancreatic juice enter here.','',''],
 b_ileum:['Small intestine','Digestive',10,'A long, coiled tube where most digestion and the absorption of nutrients happen.','Its inner lining is folded, which increases the surface area for absorption. Nutrients pass into blood vessels in the mesentery.',''],
 b_mesent:['Mesentery','Digestive',10,'A thin, clear membrane that holds the intestines in place.','It carries the blood vessels, nerves and lymph vessels that serve the intestines.',''],
 b_pancreas:['Pancreas','Digestive',10,'A thin, pale gland between the stomach and the duodenum. It makes digestive enzymes.','Pancreatic enzymes digest proteins, carbohydrates and fats in the small intestine.','Small clusters of cells in the pancreas (islets) release insulin and glucagon, the hormones that keep blood glucose steady.'],
 b_spleen:['Spleen','Immune',10,'A small, round, dark red organ in the mesentery. It is part of the circulatory and immune systems.','The spleen removes old red blood cells from the blood and stores white blood cells that fight infection.',''],
 b_lgint:['Large intestine','Digestive',10,'The wide last part of the intestine. It absorbs water and forms feces.','','Taking back water here helps the frog maintain its water balance.'],
 b_bladder:['Urinary bladder','Excretory',10,'A thin, two-lobed sac that stores urine.','It opens into the cloaca on the ventral side.','On land, frogs can take water back from the bladder into the blood, a way to save water when they are away from a pond.'],
 b_fat:['Fat bodies','Digestive',10,'Yellow-orange, finger-like structures that store energy.','Their size changes with the seasons. They are largest in the fall and get used up during hibernation and the breeding season.','Stored fat lets the frog survive winter dormancy. As an ectotherm, its body temperature and metabolism drop with the cold, so it needs very little energy.'],
 b_kidney:['Kidney','Excretory',10,'Long, dark red organs against the back wall of the body cavity. They filter wastes from the blood and make urine.','Urine leaves each kidney through a thin duct to the cloaca.','Adult frogs excrete mostly urea, while tadpoles excrete ammonia straight into the water. In fresh water, the kidneys make lots of dilute urine to get rid of extra water that seeps in through the skin.'],
 b_ureter:['Ureter (urogenital duct)','Excretory',11,'A thin tube that carries urine from the kidney to the cloaca.','In male frogs this duct also carries sperm, so it is called the urogenital duct.',''],
 b_adrenal:['Adrenal gland','Endocrine',12,'A thin yellow-orange stripe on the surface of each kidney.','','It releases adrenaline and corticosteroid hormones, which prepare the body for stress and help control salt and water balance.'],
 b_testis:['Testis','Reproductive',10,'Pale yellow, bean-shaped organs attached to the kidneys. They produce sperm.','Sperm travels through tiny tubes into the kidney and out the urogenital duct. Fertilization is external: the male releases sperm over the eggs as the female lays them.','The testes also make testosterone, which causes the thumb pads to swell in the breeding season.'],
 b_ovary:['Ovary','Reproductive',10,'Large, lobed sacs packed with black-and-white eggs. In spring the ovaries can fill most of the body cavity.','Eggs burst out of the ovary into the body cavity and are swept into the oviducts. Fertilization happens outside the body, in the water.','Estrogen from the ovaries signals the liver to make yolk proteins, which travel in the blood to the growing eggs.'],
 b_oviduct:['Oviduct','Reproductive',11,'A long, white, coiled tube that carries eggs from the body cavity toward the cloaca.','Glands in the oviduct wall coat each egg in jelly, which swells in water and protects the eggs.',''],
 b_ovisac:['Ovisac','Reproductive',11,'The thin, stretchy end of each oviduct. Eggs are stored here until they are laid.','',''],
 b_aorta:['Dorsal aorta','Circulatory',10,'The main artery running along the back. It carries blood to the organs and legs.','It forms where the two aortic arches join behind the heart and splits into the iliac arteries of the hind legs.',''],
 b_postcava:['Postcaval vein','Circulatory',11,'The large vein that returns blood from the kidneys and hind body to the heart.','',''],
 b_cloaca:['Cloaca','Excretory',10,'The chamber at the end of the digestive tract. The intestine, bladder, kidneys and gonads all empty into it.','',''],
 b_gut:['Digestive tract','Digestive',10,'The stomach, small intestine, large intestine, pancreas and spleen, removed together with their mesentery.','Follow the path food takes: esophagus, stomach, duodenum, small intestine, large intestine, cloaca.',''],
 br_skin:['Skin of the head','Integumentary',10,'The thin head skin was cut and peeled back to reach the skull.','',''],
 br_skull:['Skull (cranium)','Skeletal',10,'Flat bones that form a protective case around the brain.','The bones meet at wavy joints called sutures.',''],
 br_eye:['Eye','Sensory',10,'The eyes are close to the brain. The optic nerves (underneath) carry signals from the eyes to the optic lobes.','',''],
 br_olf:['Olfactory lobes','Nervous',10,'The front part of the brain. It processes smells.','Olfactory nerves run forward from these lobes to the nostrils.',''],
 br_cereb:['Cerebrum (cerebral hemispheres)','Nervous',10,'The cerebrum controls learning and voluntary behaviour.','In frogs the cerebrum is small and handles mostly smell and simple behaviour. In humans it is the largest part of the brain and controls thinking, memory and voluntary movement.',''],
 br_dien:['Diencephalon and pineal body','Nervous',11,'The region behind the cerebrum. It includes the thalamus, the hypothalamus and the pineal body (the small dot on top).','The pineal body senses light and releases melatonin, which helps set daily and seasonal rhythms.','The hypothalamus is the control centre for homeostasis. It links the nervous system to the endocrine system through the pituitary gland on the underside of the brain.'],
 br_optic:['Optic lobes','Nervous',10,'Two large, round lobes that process vision.','They are large in frogs because a frog depends on sight to catch moving prey.',''],

function cutStart(t,p){const prog=S.cp[t.k]||0;const sm=sample(t.cut);const cur=sm[Math.round(prog*(sm.length-1))];if(dist(p,cur)<22)return{rev:false};if(prog===0&&dist(p,sm[sm.length-1])<22)return{rev:true};return null;}
const M_=['mflapL','mflapR'];
const NEEDS={flapL:['cutMid','cutTop','cutBot'],flapR:['cutMid','cutTop','cutBot'],mlift:['flapL','flapR'],mcut:['flapL','flapR'],sternum:['flapL','flapR'],mTop:['flapL','flapR'],mBot:['flapL','flapR'],
 mflapL:['mcut','sternum','mTop','mBot'],mflapR:['mcut','sternum','mTop','mBot'],liverUp:M_,rmFatL:M_,rmFatR:M_,rmOvL:M_,rmOvR:M_,rmLiver:M_,rmHeart:M_,cutInt:M_,cutEso:[...M_,'rmLiver','rmHeart'],rmGut:['cutEso','cutInt'],rmLung:M_,
 tongue:['hL','hR'],eust:['hL','hR'],eso:['hL','hR'],peelL:['bcut'],peelR:['bcut'],skL:['peelL'],skR:['peelR'],skLift:['skL','skR']};
const needsMet=k=>(NEEDS[k]||[]).every(x=>S.d[S.tab].has(x));
function cands(wantBlocked=false){const D=S.d[S.tab],out=[];
 if(S.mode==='guided'){if(wantBlocked)return out;const i=curIdx();if(i>=0&&STEPS[S.tab][i].tg)for(const t of STEPS[S.tab][i].tg)if(!D.has(t.k))out.push([STEPS[S.tab][i],t]);return out;}
 for(const st of STEPS[S.tab]){if(!st.tg||(st.cond&&!st.cond()))continue;for(const t of st.tg)if(!D.has(t.k)&&needsMet(t.k)!==wantBlocked)out.push([st,t]);}return out;}
function wrongTool(st){const guided=S.mode==='guided';const m=(st.bad&&st.bad[S.tool])||({lens:'The hand lens is for looking. This step needs a tool.',pins:'Pins hold things in place in the wax. Is that what this step needs?',forceps:'Forceps grip and lift tissue. They do not cut.',scissors:'Scissors cut whatever is between the blades. Is cutting what this step needs?',scalpel:'A scalpel slices deep with very little pressure. It could cut structures you want to keep.',probe:'A probe is blunt. It is for moving and pointing, not cutting or holding.',bone:'Bone cutters are heavy-duty and only for cutting bone.'}[S.tool]);
 banner(m+(guided?` Use the ${TOOLS[st.tool]}.`:''),'bad');panel();}
function laterHit(p,h){const L=STEPS[S.tab],i=curIdx();for(let j=i+1;j<L.length;j++){const st=L[j];if(!applicable(st)||!st.tg)continue;for(const t of st.tg){if(S.d[S.tab].has(t.k))continue;if(t.cut){const sm=sample(t.cut);if(dist(p,sm[0])<16||dist(p,sm[sm.length-1])<16)return st;}else if(targetHit(t,p,h))return st;}}return null;}
tray.addEventListener('pointerdown',e=>{if(e.button>0)return;const p=svgPt(e),h=hitId(e);const i=curIdx();const st=i>=0?STEPS[S.tab][i]:null;const D=S.d[S.tab];const own=S.mode==='own';
 const C=cands();
 for(const [s2,t] of C){if(!t.cut)continue;const cs=cutStart(t,p);if(cs){if(S.tool!==s2.tool){if(S.tool==='lens'&&h)break;wrongTool(s2);return;}
   if(cs.rev){t.cut=t.cut.slice().reverse();}drag={t,sm:sample(t.cut)};tray.setPointerCapture(e.pointerId);e.preventDefault();return;}}
 if(S.tab==='body'&&C.some(([,t])=>t.k==='mcut')&&S.tool==='scissors'&&Math.abs(p[0]-CX)<5&&p[1]>P(0,250)[1]&&p[1]<P(0,395)[1]){banner('Careful! Cutting right on the midline would slice the ventral abdominal vein. Start the cut a little to one side.','bad');return;}
 const hits=C.filter(([,t])=>!t.cut&&targetHit(t,p,h));
 if(hits.length&&S.tool!=='lens'){const m=hits.find(([s2])=>s2.tool===S.tool);if(m){doTarget(m[1]);return;}wrongTool(hits[0][0]);return;}
 if(S.tool==='lens'){if(h){select(h.id);if(st&&st.find&&st.find.includes(h.id)){D.add('f'+i);banner('Yes! That is the '+INFO[h.id][0].toLowerCase().replace(/ \(.*\)/,'')+'.','ok');advance(false);drawLabels();}}else select(null);return;}
 if(!own&&st&&st.find){banner('Use the hand lens to identify structures.','info');return;}
 if(own){const B=cands(true).filter(([s2,t])=>s2.tool===S.tool&&(t.cut?(()=>{const sm=sample(t.cut);return dist(p,sm[0])<18||dist(p,sm[sm.length-1])<18;})():targetHit(t,p,h)));
   if(B.length){banner('You can\'t reach that yet. Something is still covering it, or another cut has to come first.','info');return;}
   banner(h?`The ${TOOLS[S.tool].toLowerCase()} won't do anything useful to the ${INFO[h.id]?INFO[h.id][0].toLowerCase():'tissue'} right now. Try another tool or another spot.`:'Nothing to do there. Try another spot, or use the hand lens to explore.','info');return;}
 const later=laterHit(p,h);if(later&&S.tool===later.tool){banner('Not yet. Think about what has to happen before this step.','bad');return;}
 if(st&&st.tg){if(S.tool===st.tool)banner('Not quite there. Follow the yellow marker.','info');else wrongTool(st);}
 else if(S.tool!=='lens')banner('There is nothing to do with that tool right now. Use the hand lens to explore.','info');});
tray.addEventListener('pointermove',e=>{const p=svgPt(e);ghost(p);
 if(drag){const{t,sm}=drag;let prog=Math.round((S.cp[t.k]||0)*(sm.length-1));for(let k=prog+1;k<Math.min(sm.length,prog+10);k++){if(dist(p,sm[k])<16)prog=k;}
  S.cp[t.k]=prog/(sm.length-1);if(prog>=sm.length-2){S.cp[t.k]=1;drag=null;doTarget(t);return;}
  // live incision
  let inc=$('liveCut');if(!inc){inc=document.createElementNS('http://www.w3.org/2000/svg','path');inc.id='liveCut';inc.setAttribute('stroke','#2a0d08');inc.setAttribute('stroke-width','2.2');inc.setAttribute('fill','none');$('marks').appendChild(inc);}
  inc.setAttribute('d','M'+sm.slice(0,prog+1).map(pt).join('L'));return;}
 const h=hitId(e);const el=h?h.el:null;if(el!==hovEl){if(hovEl)hovEl.classList.remove('hov');hovEl=el;if(el&&(S.tool==='lens'))el.classList.add('hov');}
 if(S.tool==='lens'&&!S.sel&&!S.cu.dish){S.lensAt=p;const w=170;fitVB($('cu'),p[0]-w/2,p[1]-w/2,w,w,0);$('cuNote').textContent='';}});
tray.addEventListener('pointerup',()=>{if(drag){drag=null;render();}});
tray.addEventListener('pointerleave',()=>{$('ghost').innerHTML='';if(hovEl){hovEl.classList.remove('hov');hovEl=null;}});
function ghost(p){if(S.tool==='lens'){$('ghost').innerHTML='';tray.classList.remove('cross');return;}tray.classList.add('cross');
 const k=VB()[2]/760;$('ghost').innerHTML=`<g transform="translate(${n1(p[0]+4*k)} ${n1(p[1]-30*k)}) scale(${n1(1.3*k)})" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="color:#fff;filter:drop-shadow(0 1px 1.5px #000)">${ICON[S.tool]}</g>`;}
function doTarget(t){const D=S.d[S.tab];D.add(t.k);
 const msg={pin4:'The frog is pinned.',lift1:'Skin lifted.',flapR:'Skin flaps pinned back.',flapL:'Skin flap pinned back.',sternum:'The breastbone is cut.',mflapR:'The body cavity is open.',mflapL:'Muscle flap pinned back.',liverUp:'The liver is lifted. Look underneath!',rmLiver:'The liver is in the specimen dish.',rmHeart:'The heart is in the specimen dish.',rmGut:'The digestive tract is in the specimen dish.',rmLung:'The lung is in the specimen dish.',tongue:'The tongue flips forward: it is attached at the front!',skLift:'The brain is exposed.'}[t.k];
 if(t.k==='hL'||t.k==='hR'){if(D.has('hL')&&D.has('hR')){S.mouthAnim=true;banner('The mouth opens wide.','ok');}}
 else if(msg)banner(msg,'ok');
 if(/^rm/.test(t.k)){const dk=DISH.find(d=>d[2].includes(t.k));if(dk&&!(S.sel))S.cu.dish=null;}
 if(t.k==='rmLiver'||t.k==='rmGut'||t.k==='rmHeart')S.sel=null;
 advance();}

/* ---------------- controls ---------------- */
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;S.tab=b.dataset.tab;S.sel=null;S.cu.dish=null;S.lensAt=null;S.hint=false;const i=curIdx();if(S.mode==='guided'&&i>=0){const st=STEPS[S.tab][i];S.tool=st.tool||'lens';}else S.tool='lens';render();});
$('tools').addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(!b)return;S.tool=b.dataset.tool;toolsUI();drawMarks();});
$('dish').addEventListener('click',e=>{const b=e.target.closest('[data-dish]');if(!b)return;S.cu.dish=S.cu.dish===b.dataset.dish?null:b.dataset.dish;S.cu.view='out';S.sel=null;document.querySelectorAll('#scene .sel').forEach(x=>x.classList.remove('sel'));drawLabels();info();closeup();});
$('cuViews').addEventListener('click',e=>{const b=e.target.closest('[data-cuv]');if(!b)return;S.cu.view=b.dataset.cuv;closeup();});
$('sex').onchange=e=>{S.sex=e.target.value;S.d.body=new Set();S.d.ext.delete('f6');S.d.ext.delete('f7');S.d.mouth=new Set([...S.d.mouth].filter(k=>k!=='f7'));for(const k in S.cp)if(!/^(h|b|sk)/.test(k))delete S.cp[k];S.sel=null;S.cu.dish=null;banner(`New ${S.sex==='m'?'male':'female'} specimen in the tray. The body cavity dissection starts fresh.`,'info');render();};
const seg=(id,f)=>$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...$(id).children].forEach(x=>x.classList.toggle('on',x===b));f(b.dataset.v);});
seg('modeSeg',v=>{S.mode=v;S.hint=false;const i=curIdx();if(v==='guided'&&i>=0){const st=STEPS[S.tab][i];S.tool=st.tool||'lens';}banner(v==='own'?'On your own: explore freely. Choose any tool and work in any order.':'Guided: follow the yellow markers.','info');render();});
window.addEventListener('resize',()=>{closeup();});
window.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;const keys={'1':'lens','2':'pins','3':'forceps','4':'scissors','5':'scalpel','6':'probe','7':'bone'};if(keys[e.key]){S.tool=keys[e.key];toolsUI();drawMarks();}});

defineCuts();defineSteps();
render();
window.__frog={S,render,STEPS,curIdx,doTarget,advance};
})();
</script>
