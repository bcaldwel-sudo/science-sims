<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carbon and Nitrogen Cycles Lab</title>
<style>
/* Carbon and Nitrogen Cycles Lab (SNC1L 6.7), simple version (2026-11-27).
   Three parts, one per D2L quiz page. Each part is one picture. Every arrow always shows its process name,
   so students can read answers straight off the screen. Tapping a box or arrow shows one sentence in the box below. */
:root{
  color-scheme:light;
  --bg:#EEF2F4; --card:#FFFFFF; --ink:#17232B; --muted:#4D5E67; --line:#C9D4DA; --header:#123247; --accent:#1C6E9C; --focus:#F2B63D;
  --sky:#E3F2FB; --soil:#D9C3A0; --rock:#C8B7A0; --ocean:#CFE6F6;
  --air:#3C9AD8; --life:#2E8B3E; --dead:#8A5A34; --rockc:#8A6A45; --sea:#1D5F9E; --people:#C0392B; --n:#2F4FA8;
  --up:#B8321A; --down:#1D6B39;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:17px}
body{display:flex;flex-direction:column;overflow:hidden}
header{flex:none;background:var(--header);color:#fff;padding:6px 12px;display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap}
header h1{margin:0;font-size:19px;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:16px;font-weight:700;border:2px solid #7FB2D3;background:transparent;color:#fff;border-radius:9px;padding:4px 12px;cursor:pointer}
.tabs button[aria-selected="true"]{background:#fff;color:var(--header);border-color:#fff}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.view{flex:1;min-height:0;display:none;flex-direction:column;gap:8px;padding:8px 10px 10px}
.view.on{display:flex}
.pic{flex:1;min-height:0;position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pic svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.info{flex:none;min-height:58px;background:var(--card);border:1px solid var(--line);border-left:7px solid var(--accent);border-radius:12px;padding:9px 14px;font-size:19px;line-height:1.35}
.info b{color:var(--accent)}
/* diagram */
.box rect.frame{stroke-width:3;rx:14}
.box text{font-family:Arial,Helvetica,sans-serif;text-anchor:middle;fill:var(--ink)}
.box .nm{font-size:23px;font-weight:700}
.box .sm{font-size:16px}
.tap{cursor:pointer}
.tap:hover rect.frame,.tap.sel rect.frame{stroke:var(--focus)!important;stroke-width:5}
.arw path.ln{fill:none;stroke-width:5}
.arw path.hit{fill:none;stroke:transparent;stroke-width:34}
.arw text{font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
.arw .num{font-size:18px}
.arw:hover path.ln,.arw.sel path.ln{stroke-width:8}
.band{font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:700;letter-spacing:.08em;fill:#5B4632}
/* part 2 */
#humanView .wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.panel h2{margin:0;font-size:20px}
.lever .nm{font-weight:700;font-size:19px}
#levers{display:flex;flex-direction:column;gap:16px}
.lever small{display:block;color:var(--muted);font-size:15px;margin-top:1px}
.seg{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.seg button{font:inherit;font-size:18px;font-weight:700;padding:6px 18px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-width:84px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.reset{align-self:flex-start;font:inherit;font-weight:700;font-size:16px;padding:6px 14px;border-radius:10px;border:2px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer}
.result{justify-content:center;align-items:stretch;text-align:center}
.verdict{font-size:30px;font-weight:700;padding:12px;border-radius:12px}
.verdict.up{background:#FBE9E5;color:var(--up)} .verdict.down{background:#E6F4EA;color:var(--down)}
.big{font-size:20px}
.big b{font-size:26px}
.meter{position:relative;height:34px;border-radius:17px;background:linear-gradient(90deg,#E6F4EA,#FFF6DA 40%,#FBE9E5);border:1px solid var(--line);margin:6px 8px 26px}
.meter .mk{position:absolute;top:-6px;width:6px;height:46px;margin-left:-3px;border-radius:3px;background:var(--ink);transition:left .35s}
.meter .now{position:absolute;top:0;bottom:0;width:0;border-left:3px dashed var(--muted)}
.meter .lab{position:absolute;top:38px;font-size:14px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.cmp{font-size:20px;padding:10px;border-radius:10px;background:var(--bg)}
.cmp b{font-size:22px}
@media (prefers-reduced-motion:reduce){.meter .mk{transition:none}}
@media (max-width:760px){
  body{overflow:auto}
  .view.on{flex:none}
  .pic{flex:none;height:56vw;min-height:230px}
  #humanView .wrap{grid-template-columns:1fr}
  .info{font-size:17px}
}
</style>
</head>
<body>
<header>
  <h1>Carbon and Nitrogen Cycles Lab</h1>
  <div class="tabs" role="tablist">
    <button role="tab" id="t1" aria-selected="true" aria-controls="carbonView">Part 1: Carbon Cycle</button>
    <button role="tab" id="t2" aria-selected="false" aria-controls="humanView">Part 2: Humans and CO₂</button>
    <button role="tab" id="t3" aria-selected="false" aria-controls="nitroView">Part 3: Nitrogen Cycle</button>
  </div>
</header>

<main id="carbonView" class="view on" role="tabpanel" aria-labelledby="t1">
  <div class="pic"><svg id="cSvg" viewBox="0 0 1100 600" role="img" aria-label="Carbon cycle diagram"></svg></div>
  <div class="info" id="cInfo" aria-live="polite"></div>
</main>

<main id="humanView" class="view" role="tabpanel" aria-labelledby="t2">
  <div class="wrap">
    <div class="panel">
      <h2>Change what people do</h2>
      <div id="levers"></div>
      <button class="reset" id="reset">Reset to Today</button>
    </div>
    <div class="panel result">
      <h2>Carbon dioxide (CO₂) in the air</h2>
      <div class="verdict" id="verdict"></div>
      <div class="big">CO₂ in the year 2100: <b id="ppm"></b> ppm</div>
      <div class="meter" id="meter"><div class="now" id="nowMk"></div><span class="lab" id="nowLab">2025: 425</span><div class="mk" id="mk"></div></div>
      <div class="cmp" id="cmp"></div>
    </div>
  </div>
  <div class="info" id="hInfo">Press a button. Then read the boxes on the right.</div>
</main>

<main id="nitroView" class="view" role="tabpanel" aria-labelledby="t3">
  <div class="pic"><svg id="nSvg" viewBox="0 0 1100 600" role="img" aria-label="Nitrogen cycle diagram"></svg></div>
  <div class="info" id="nInfo" aria-live="polite"></div>
</main>

<script>
(function(){
"use strict";
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function txt(p,x,y,s,a){const t=el('text',Object.assign({x,y},a||{}),p);t.textContent=s;return t;}

/* tabs */
const tabs=[['t1','carbonView'],['t2','humanView'],['t3','nitroView']];
tabs.forEach(([b,v])=>$(b).addEventListener('click',()=>tabs.forEach(([b2,v2])=>{const on=b2===b;$(b2).setAttribute('aria-selected',on);$(v2).classList.toggle('on',on);})));

/* ---------- small icons (drawn inside boxes) ---------- */
const ICON={
  air:(g,x,y)=>{[[-40,0],[0,-6],[40,2]].forEach(([dx,dy])=>{el('circle',{cx:x+dx-10,cy:y+dy,r:6,fill:'#E25B4F'},g);el('circle',{cx:x+dx,cy:y+dy,r:7,fill:'#4A4A4A'},g);el('circle',{cx:x+dx+10,cy:y+dy,r:6,fill:'#E25B4F'},g);});},
  n2:(g,x,y)=>{[[-40,0],[0,-6],[40,2]].forEach(([dx,dy])=>{el('circle',{cx:x+dx-6,cy:y+dy,r:7,fill:'#2F4FA8'},g);el('circle',{cx:x+dx+6,cy:y+dy,r:7,fill:'#2F4FA8'},g);});},
  tree:(g,x,y)=>{[[-22,1],[0,1.2],[22,.9]].forEach(([dx,s])=>{el('rect',{x:x+dx-3,y:y+6,width:6,height:12,fill:'#6B4A2E'},g);el('path',{d:`M${x+dx} ${y-24*s} L${x+dx+13*s} ${y+8} H${x+dx-13*s}Z`,fill:'#2D7A3D'},g);});},
  deer:(g,x,y)=>{const t=el('g',{transform:`translate(${x-30} ${y-20}) scale(.95)`,fill:'#8A5A34'},g);
    el('path',{d:'M0 22 C8 12 34 10 48 16 L58 6 L62 2 L66 10 L60 16 C62 24 56 28 50 30 L50 44 L46 44 L45 32 C34 34 18 34 10 30 L9 44 L5 44 L5 30 C2 28 0 26 0 22Z'},t);
    el('path',{d:'M60 4 L56 -8 M62 2 L68 -10',stroke:'#6B4527','stroke-width':2.4,fill:'none'},t);},
  cow:(g,x,y)=>{const t=el('g',{transform:`translate(${x-36} ${y-18}) scale(.62)`},g);
    el('rect',{x:0,y:10,width:100,height:40,rx:16,fill:'#F4F1EA',stroke:'#3B3B3B','stroke-width':3},t);
    el('path',{d:'M18 18 q14 -6 22 8 q-8 14 -24 6Z M58 30 q16 -10 26 4 q-6 14 -24 8Z',fill:'#3B3B3B'},t);
    [8,26,68,84].forEach(lx=>el('rect',{x:lx,y:46,width:10,height:18,fill:'#F4F1EA',stroke:'#3B3B3B','stroke-width':2},t));
    el('path',{d:'M96 18 L120 14 Q132 22 128 38 L106 42Z',fill:'#F4F1EA',stroke:'#3B3B3B','stroke-width':3},t);},
  mush:(g,x,y)=>{[[-18,1],[14,.8]].forEach(([dx,s])=>{el('rect',{x:x+dx-4*s,y:y-4,width:8*s,height:20*s,fill:'#EFE6D6',stroke:'#B9A98F'},g);el('path',{d:`M${x+dx-18*s} ${y-2} q${18*s} -${26*s} ${36*s} 0Z`,fill:'#C0504D'},g);});
    el('path',{d:`M${x-40} ${y+18} H${x+40}`,stroke:'#6B4A2E','stroke-width':4},g);},
  leaves:(g,x,y)=>{el('ellipse',{cx:x,cy:y+10,rx:44,ry:9,fill:'#6B4A2E'},g);[[-26,4,'#B8862E'],[0,0,'#9C6B2A'],[22,4,'#B8862E']].forEach(([dx,dy,c])=>el('path',{d:`M${x+dx-12} ${y+dy+4} q12 -16 24 -2 q-12 9 -24 2Z`,fill:c},g));},
  volcano:(g,x,y)=>{el('path',{d:`M${x-40} ${y+18} L${x-12} ${y-22} H${x+12} L${x+40} ${y+18}Z`,fill:'#7E7066'},g);el('path',{d:`M${x-2} ${y-20} q-4 16 2 36`,stroke:'#F06A1F','stroke-width':5,fill:'none'},g);
    el('circle',{cx:x+6,cy:y-34,r:9,fill:'#B7B9BC'},g);el('circle',{cx:x+18,cy:y-44,r:11,fill:'#B7B9BC'},g);},
  fuel:(g,x,y)=>{[[-60,4],[-42,-2],[-50,12]].forEach(([dx,dy])=>el('path',{d:`M${x+dx-9} ${y+dy} l7 -9 l11 2 l4 10 l-8 8 l-11 -2Z`,fill:'#222'},g));
    el('path',{d:`M${x+2} ${y-14} q12 16 12 24 a12 12 0 0 1 -24 0 q0 -8 12 -24Z`,fill:'#2B2B2B'},g);
    el('path',{d:`M${x+46} ${y-10} h18 v26 h-18Z M${x+50} ${y-16} h10 v6 h-10Z`,fill:'#5A7FA0'},g);},
  lime:(g,x,y)=>{for(let r=0;r<2;r++)for(let c=0;c<4;c++)el('rect',{x:x-62+c*31+(r%2?15:0),y:y-12+r*14,width:29,height:12,fill:'#EDE5CE',stroke:'#B9A98F'},g);},
  wave:(g,x,y)=>{el('path',{d:`M${x-60} ${y} q15 -10 30 0 t30 0 t30 0 t30 0`,stroke:'#1D5F9E','stroke-width':4,fill:'none'},g);},
  soilA:(g,x,y)=>{[[-30,0],[0,-6],[30,2]].forEach(([dx,dy])=>{el('circle',{cx:x+dx,cy:y+dy,r:7,fill:'#2F4FA8'},g);[[-9,-6],[9,-6],[0,9]].forEach(([hx,hy])=>el('circle',{cx:x+dx+hx,cy:y+dy+hy,r:4,fill:'#fff',stroke:'#7A8A99'},g));});},
  soilN:(g,x,y)=>{[[-30,0],[0,-6],[30,2]].forEach(([dx,dy])=>{el('circle',{cx:x+dx,cy:y+dy,r:7,fill:'#2F4FA8'},g);[[-9,-6],[9,-6],[0,9]].forEach(([hx,hy])=>el('circle',{cx:x+dx+hx,cy:y+dy+hy,r:5,fill:'#E25B4F'},g));});},
};

/* ---------- diagram builder ---------- */
function Diagram(svgId,infoId,cfg){
  const svg=$(svgId),info=$(infoId);
  const defs=el('defs',{},svg);
  const colors=new Set(cfg.arrows.map(a=>a.color));
  colors.forEach(c=>{const m=el('marker',{id:svgId+c.replace('#',''),viewBox:'0 0 10 10',refX:6,refY:5,markerWidth:4,markerHeight:4,orient:'auto'},defs);el('path',{d:'M0 0L10 5L0 10z',fill:c},m);});
  cfg.background(svg);
  let selected=null;
  const show=(item,g)=>{if(selected)selected.classList.remove('sel');selected=g;g.classList.add('sel');info.innerHTML=`<b>${item.title}:</b> ${item.say}`;};
  const reset=()=>{info.innerHTML=cfg.hint;};
  const arrowsG=el('g',{},svg),boxesG=el('g',{},svg),labelsG=el('g',{},svg);
  cfg.boxes.forEach(b=>{
    const g=el('g',{class:'box tap',tabindex:0,role:'button','aria-label':b.name},boxesG);
    el('rect',{class:'frame',x:b.x,y:b.y,width:b.w,height:b.h,rx:14,fill:b.fill||'#fff',stroke:b.stroke},g);
    const cx=b.x+b.w/2;
    if(b.icon)ICON[b.icon](g,cx,b.y+(b.iconY||32));
    txt(g,cx,b.y+(b.nameY||b.h-(b.sub?34:16)),b.name,{class:'nm'});
    (b.sub||[]).forEach((s,i)=>txt(g,cx,b.y+b.h-12-(b.sub.length-1-i)*19,s,{class:'sm'}));
    const it={title:b.name,say:b.say};
    g.addEventListener('click',e=>{e.stopPropagation();show(it,g);});
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(it,g);}});
  });
  cfg.arrows.forEach(a=>{
    const g=el('g',{class:'arw tap',tabindex:0,role:'button','aria-label':a.name},arrowsG);
    el('path',{class:'hit',d:a.d},g);
    el('path',{class:'ln',d:a.d,stroke:a.color,'marker-end':`url(#${svgId+a.color.replace('#','')})`},g);
    const lg=el('g',{class:'arw tap'},labelsG);
    const lines=[].concat(a.name);
    lines.forEach((s,i)=>txt(lg,a.lx,a.ly+i*22,s,{'text-anchor':a.anchor||'middle',fill:a.color}));
    if(a.note)txt(lg,a.lx,a.ly+lines.length*22-2,a.note,{'text-anchor':a.anchor||'middle',fill:'#4D5E67',style:'font-size:15px;font-weight:400'});
    const it={title:lines.join(' ').replace(/^\d\.\s*/,''),say:a.say};
    [g,lg].forEach(x=>{x.addEventListener('click',e=>{e.stopPropagation();show(it,g);});});
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(it,g);}});
  });
  svg.addEventListener('click',()=>{if(selected)selected.classList.remove('sel');selected=null;reset();});
  reset();
}

/* ---------- Part 1: carbon cycle ---------- */
Diagram('cSvg','cInfo',{
  hint:'Each arrow shows how carbon moves. <b>Tap</b> a box or an arrow to learn more.',
  background:svg=>{
    el('rect',{width:1100,height:600,fill:'#fff'},svg);
    el('rect',{width:1100,height:400,fill:'#E9F5FC'},svg);
    el('rect',{x:0,y:420,width:1100,height:180,fill:'#E8DCC8'},svg);
    el('path',{d:'M0 420 H1100',stroke:'#B9A98F','stroke-width':2},svg);
    txt(svg,230,452,'LITHOSPHERE (rock under the ground)',{class:'band','text-anchor':'start'});
  },
  boxes:[
    {name:'Air',sub:['carbon dioxide (CO₂)'],x:390,y:12,w:320,h:96,icon:'air',iconY:28,stroke:'#3C9AD8',nameY:62,
      say:'Carbon is in the air as the gas <b>carbon dioxide (CO₂)</b>.'},
    {name:'Plants',x:60,y:230,w:160,h:100,icon:'tree',stroke:'#2E8B3E',
      say:'Plants take in CO₂ from the air to make food (<b>photosynthesis</b>). Plants also release CO₂ (<b>respiration</b>).'},
    {name:'Animals',x:290,y:230,w:160,h:100,icon:'deer',stroke:'#2E8B3E',
      say:'Animals get carbon by <b>eating</b> plants. Animals put CO₂ back into the air when they breathe (<b>respiration</b>).'},
    {name:'Decomposers',sub:['fungi and bacteria'],x:560,y:230,w:200,h:100,icon:'mush',iconY:26,stroke:'#8A5A34',nameY:64,
      say:'Decomposers, like <b>fungi</b> and <b>bacteria</b>, break down dead things and waste. They release CO₂ into the air.'},
    {name:'Ocean',sub:['CO₂ + water','→ carbonic acid'],x:860,y:180,w:225,h:190,icon:'wave',iconY:22,stroke:'#1D5F9E',fill:'#EAF4FC',nameY:62,
      say:'CO₂ from the air dissolves in the ocean. CO₂ reacts with water to form <b>carbonic acid</b>.'},
    {name:'Plankton',sub:['photosynthesis'],x:885,y:72,w:175,h:0,stroke:'none',nameY:0},
    {name:'Volcano',x:30,y:470,w:170,h:110,icon:'volcano',iconY:46,stroke:'#8A6A45',
      say:'Volcanoes release carbon from the <b>lithosphere</b> into the air.'},
    {name:'Fossil fuels',sub:['coal, oil, natural gas'],x:560,y:470,w:270,h:110,icon:'fuel',iconY:30,stroke:'#3B3B3B',nameY:74,
      say:'Carbon is stored in the <b>lithosphere</b> as fossil fuels: <b>coal</b>, <b>oil</b> and <b>natural gas</b>.'},
    {name:'Limestone',x:870,y:470,w:205,h:110,icon:'lime',iconY:40,stroke:'#8A6A45',
      say:'Carbon is stored in the <b>lithosphere</b> in rocks like <b>limestone</b>. Limestone is made from old shells.'},
  ].filter(b=>b.h>0),
  arrows:[
    {name:'Photosynthesis',d:'M400 100 L180 228',color:'#2E8B3E',lx:250,ly:142,anchor:'end',
      say:'Plants take in CO₂ from the air and use sunlight to make sugar.'},
    {name:'Respiration',d:'M210 228 L432 100',color:'#C0392B',lx:318,ly:192,anchor:'start',
      say:'Plants use sugar for energy and release CO₂ into the air.'},
    {name:'Respiration',d:'M392 228 L500 100',color:'#C0392B',lx:462,ly:170,anchor:'start',
      say:'Animals release CO₂ into the air when they breathe.'},
    {name:'Eating',d:'M222 280 L286 280',color:'#2E8B3E',lx:254,ly:270,
      say:'An animal eats a plant. The carbon becomes part of the animal.'},
    {name:['Death and','waste'],d:'M452 300 L556 300',color:'#8A5A34',lx:504,ly:350,
      say:'Dead plants, dead animals and animal waste go to the decomposers.'},
    {name:'Decomposition',d:'M640 228 L640 112',color:'#C0392B',lx:650,ly:176,anchor:'start',
      say:'Decomposers break down dead things and release CO₂ into the air.'},
    {name:'Dissolving',d:'M712 70 Q850 80 900 176',color:'#1D5F9E',lx:800,ly:58,
      say:'CO₂ from the air is absorbed by the ocean. It forms carbonic acid.'},
    {name:['Burning','fossil fuels'],d:'M800 466 Q820 260 712 104',color:'#C0392B',lx:820,ly:398,anchor:'start',
      say:'People burn coal, oil and natural gas in cars, homes and power plants. This releases CO₂ into the air.'},
    {name:['Volcano','erupting'],d:'M70 466 C0 300 0 40 386 34',color:'#C0392B',lx:12,ly:376,anchor:'start',
      say:'Volcanoes release CO₂ from the lithosphere into the air.'},
  ],
});
/* plankton chip inside the ocean box (photosynthesis in the water) */
(function(){
  const svg=$('cSvg'),info=$('cInfo');
  const g=el('g',{class:'box tap',tabindex:0,role:'button','aria-label':'Plankton'},svg);
  el('rect',{class:'frame',x:885,y:268,width:175,height:88,rx:12,fill:'#fff',stroke:'#2E8B3E'},g);
  for(let i=0;i<9;i++)el('circle',{cx:905+i*17,cy:288+(i%2)*6,r:4,fill:i%2?'#7DD36A':'#4FB25A'},g);
  txt(g,972,322,'Plankton',{class:'nm',style:'font-size:20px'});
  txt(g,972,344,'photosynthesis',{class:'sm',style:'font-size:15px'});
  const say=()=>{svg.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));g.classList.add('sel');info.innerHTML='<b>Plankton:</b> Plankton are tiny living things in the ocean. Some plankton absorb CO₂ for <b>photosynthesis</b>.';};
  g.addEventListener('click',e=>{e.stopPropagation();say();});
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();say();}});
  // move the ocean's two lines up so the plankton box fits below them
  svg.querySelectorAll('.box').forEach(b=>{if(b.getAttribute('aria-label')==='Ocean'){const s=b.querySelectorAll('.sm');s[0].setAttribute('y',224+12);s[1].setAttribute('y',224+31);b.querySelector('.nm').setAttribute('y',214);b.querySelector('path').setAttribute('transform','translate(0 -8)');}});
})();

/* ---------- Part 3: nitrogen cycle ---------- */

/* ---------- Part 2: humans and CO2 (simple, fully deterministic model) ----------
   Two-box model in ppm above the 280 ppm of the 1700s. 2.12 billion tonnes of carbon = 1 ppm. 2025: 425 ppm. */
const G=2.12,K=0.04,BETA=3,START=425;
const BASE={ff:10.0,def:1.1,vol:0.1};
function co2in2100(p){
  let Xa=START-280,Xs=BETA*(Xa-(6.1/G)/K);
  for(let y=2025;y<2100;y++){
    const U=Math.max(0,K*(Xa-Xs/BETA)*G);
    const net=BASE.ff*p.ff/100+BASE.def*p.def/100+BASE.vol*p.vol/100-U;
    Xa+=net/G;Xs+=U/G;
  }
  return Math.round(280+Xa);
}
const LEVERS=[
  {k:'ff',name:'Burning fossil fuels',help:'Coal, oil and natural gas',opts:[[0,'None'],[100,'Today'],[200,'More']]},
  {k:'def',name:'Cutting down forests',help:'Fewer trees take in CO₂',opts:[[0,'None'],[100,'Today'],[200,'More']]},
  {k:'vol',name:'Volcanoes erupting',help:'Volcanoes release carbon',opts:[[0,'None'],[100,'Today'],[500,'More']]},
];
const P={ff:100,def:100,vol:100};
const TODAY=co2in2100(P);
const lev=$('levers');
LEVERS.forEach(L=>{
  const d=document.createElement('div');d.className='lever';
  d.innerHTML=`<div class="nm">${L.name}</div><small>${L.help}</small><div class="seg" role="group" aria-label="${L.name}"></div>`;
  const seg=d.querySelector('.seg');
  L.opts.forEach(([v,t])=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.dataset.v=v;b.setAttribute('aria-pressed',v===100);
    b.addEventListener('click',()=>{P[L.k]=v;seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.v===v));update();});seg.appendChild(b);});
  lev.appendChild(d);
});
$('reset').addEventListener('click',()=>{for(const k in P)P[k]=100;lev.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.v===100));update();});
const LO=250,HI=750,pos=v=>Math.max(0,Math.min(100,(v-LO)/(HI-LO)*100));
$('nowMk').style.left=pos(START)+'%';$('nowLab').style.left=pos(START)+'%';
function update(){
  const v=co2in2100(P);
  const vd=$('verdict');
  if(v>START){vd.className='verdict up';vd.textContent='CO₂ goes UP ↑';}
  else{vd.className='verdict down';vd.textContent='CO₂ goes DOWN ↓';}
  $('ppm').textContent=v;
  $('mk').style.left=pos(v)+'%';
  const d=v-TODAY,c=$('cmp');
  const allToday=P.ff===100&&P.def===100&&P.vol===100;
  if(allToday)c.innerHTML='These are <b>today’s</b> choices.';
  else if(d===0)c.innerHTML='Compared with Today: <b>the same</b>.';
  else c.innerHTML=`Compared with Today: <b>${d>0?'HIGHER':'LOWER'}</b> by ${Math.abs(d)} ppm.<br>That is a <b>${Math.abs(d)>=10?'BIG':'SMALL'}</b> change.`;
}
update();
window.__lab={co2in2100,P};
})();
