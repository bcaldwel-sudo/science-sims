<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carbon and Nitrogen Cycles Lab</title>
<style>
/* Carbon and Nitrogen Cycles Lab (SNC1L 6.7). Three tabs: 1) follow a carbon atom, 2) humans and CO2 (simple deterministic model), 3) follow a nitrogen atom.
   Short sentences for students who read below grade level. Same key words as the 6.7 handout and quiz. Light mode only. */
:root{
  color-scheme:light;
  --bg:#EEF2F4; --surface:#FFFFFF; --card:#F3F6F8; --ink:#17232B; --muted:#4D5E67; --line:#CFD9DE;
  --header:#123247; --accent:#1C6E9C; --amber:#F2B63D; --glow:#FFC21A;
  --atm:#3C9AD8; --land:#2E9447; --ocean:#1D4F91; --lith:#9A6A3A; --living:#2E7D32; --nonliving:#6B6B6B;
  --you:#D9480F; --base:#7D8A92; --hist:#2B2B2B; --pre:#2E9447; --src:#E0562B; --sink:#2F7FC1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Arial,"Segoe UI",Helvetica,sans-serif;font-size:16px}
body{display:flex;flex-direction:column;overflow:hidden}
header{flex:none;background:var(--header);color:#fff;padding:6px 14px;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
header h1{margin:0;font-size:20px;font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:2px solid #7FB2D3;background:transparent;color:#fff;padding:4px 12px;font-size:15px}
.tabs button[aria-selected="true"]{background:#fff;color:var(--header);border-color:#fff}
button{font:inherit;font-weight:700;border-radius:9px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);padding:3px 11px;cursor:pointer;white-space:nowrap}
button:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
select{font:inherit;border:2px solid var(--line);border-radius:8px;padding:2px 4px;background:var(--surface);color:var(--ink);max-width:100%}
.view{flex:1;min-height:0;display:none;gap:8px;padding:8px 10px 10px}
.view.on{display:grid}
.explore{grid-template-columns:minmax(0,1.7fr) minmax(250px,1fr)}
#humanView{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.col{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.card{border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.stage{flex:1;min-height:200px;position:relative;overflow:hidden}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
sub{font-size:70%}
/* ---------- explorer side panel ---------- */
.ptools{flex:none;padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:15px}
.ptools label{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.loc{flex:none;padding:7px 11px}
.loc .k{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.loc .n{font-size:21px;font-weight:700;line-height:1.2;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.loc p{margin:4px 0 0;font-size:15.5px;line-height:1.35}
.badge{display:inline-block;font-size:12.5px;font-weight:700;color:#fff;border-radius:20px;padding:2px 9px;vertical-align:middle;white-space:nowrap}
.g-atm{background:var(--atm)} .g-land{background:var(--land)} .g-ocean{background:var(--ocean)} .g-lith{background:var(--lith)}
.g-living{background:#fff;color:var(--living);border:2px solid var(--living)} .g-nonliving{background:#fff;color:var(--nonliving);border:2px solid var(--nonliving)}
.move{flex:none;padding:7px 11px;border-left:6px solid var(--accent)}
.move.bad{border-left-color:#C0392B;background:#FDF1EF}
.move.win{border-left-color:var(--land);background:#EEF8F0}
.move h2{margin:0;font-size:17.5px;line-height:1.25}
.move p{margin:4px 0 0;font-size:15.5px;line-height:1.35}
.tag{display:inline-block;font-size:13px;font-weight:700;border-radius:6px;padding:0 6px;margin:2px 4px 0 0;border:1.5px solid}
.tag.slow{color:#8A4B12;border-color:#E0A46A}
.tag.people{color:#9B2C12;border-color:#E9967E}
.journey{flex:1;min-height:90px;display:flex;flex-direction:column;padding:6px 10px 8px}
.journey .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap}
.journey h2{margin:0;font-size:16px}
.track{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.chip{border:2px solid var(--line);border-radius:14px;padding:0 7px;font-weight:700;color:var(--muted);background:#fff}
.chip.v{color:#fff}
.chip.v.atm{background:var(--atm);border-color:var(--atm)} .chip.v.land{background:var(--land);border-color:var(--land)}
.chip.v.ocean{background:var(--ocean);border-color:var(--ocean)} .chip.v.lith{background:var(--lith);border-color:var(--lith)}
.chip.v.proc{background:#5B3A8C;border-color:#5B3A8C}
ol.log{flex:1;min-height:0;overflow:auto;margin:5px 0 0;padding:0 0 0 26px;font-size:14.5px;line-height:1.3}
ol.log li{padding:2px 0;border-bottom:1px dashed var(--line)}
ol.log li i{color:var(--muted);font-style:normal;font-weight:700}
/* scene */
.hit{fill:rgba(255,255,255,0);stroke:none;cursor:pointer;transition:fill .2s}
.res:hover .hit{fill:rgba(255,255,255,.22)}
.res.can .hit{fill:rgba(255,214,64,.20);stroke:var(--glow);stroke-width:3;filter:url(#softglow);animation:pulse 2.2s ease-in-out infinite}
.res.here .hit{fill:rgba(255,255,255,.12);stroke:#fff;stroke-width:2.5;stroke-dasharray:7 5}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.res.can .hit{animation:none;opacity:.8}}
.res.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pill rect{fill:#fff;stroke:#41525C;stroke-width:1.5;opacity:.94}
.pill text{font:700 20px Arial,Helvetica,sans-serif;fill:#17232B;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pill.small text{font-size:16px}
.res.can .pill rect{stroke:#C98F00;stroke-width:3}
.res .pill{cursor:pointer}
.res:focus{outline:none}
.res:focus-visible .hit{stroke:#F2B63D;stroke-width:5}
.atomtxt{font:700 18px Arial,Helvetica,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.trail{fill:none;stroke:#17232B;stroke-width:3;stroke-dasharray:9 6;opacity:.8}
.trailtxt{font:700 17px Arial,Helvetica,sans-serif;fill:#17232B;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.scenetxt{font:700 15px Arial,Helvetica,sans-serif;fill:#17232B;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
/* ---------- humans view ---------- */
.ctrls{flex:none;padding:8px 12px;display:flex;flex-direction:column;gap:7px}
.ctrls h2,.graphcard h2,.flowcard h2{margin:0;font-size:17px}
.lever .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.lever .name{font-weight:700;font-size:15.5px}
.lever small{color:var(--muted);font-size:13px}
.lever+.lever{margin-top:4px}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.seg button{padding:2px 10px;font-size:14.5px;border-width:2px;border-color:var(--line);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.crow{display:flex;justify-content:flex-end}
.flowcard{flex:1;min-height:170px;display:flex;flex-direction:column;padding:8px 12px;gap:6px}
.bars{display:flex;flex-direction:column;gap:8px}
.barrow .lbl{font-weight:700;font-size:15px;margin-bottom:2px}
.bar{display:flex;height:30px;border-radius:6px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.bar span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;transition:width .3s}
.key{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--muted)}
.key i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.verdict{font-size:16px;line-height:1.35;padding:6px 10px;border-radius:8px;background:var(--card);font-weight:700}
.verdict.up{background:#FDF1EF;color:#9B2C12} .verdict.down{background:#EEF8F0;color:#1D6B39}
.graphcard{flex:1;min-height:220px;display:flex;flex-direction:column;padding:8px 12px;gap:4px}
.legend{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:13.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid}
.plot{flex:1;min-height:0;position:relative}
.plot svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.plot svg text{font-family:Arial,Helvetica,sans-serif}
.tiles{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border-radius:10px;padding:4px 10px;text-align:center}
.tile .k{font-size:13px;color:var(--muted);font-weight:700}
.tile .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.tile .v small{font-size:13px;font-weight:400;color:var(--muted)}
@media (max-width:860px){
  html,body{font-size:15px}
  header h1{font-size:17px}
  .explore{grid-template-columns:minmax(0,1.6fr) minmax(220px,1fr)}
  .loc p,.move p{font-size:14.5px}
}
@media (max-height:620px){ .lever small{display:none} }
@media (max-width:680px){
  body{overflow:auto}
  .view.on{display:flex;flex-direction:column;flex:none}
  .col{flex:none}
  .stage{min-height:0;flex:none;height:64vw}
  .flowcard{flex:none}
  .graphcard{min-height:320px}
  .journey{min-height:180px}
}
</style>
</head>
<body>
<header>
  <h1>Carbon and Nitrogen Cycles Lab</h1>
  <div class="tabs" role="tablist">
    <button role="tab" id="tabC" aria-selected="true" aria-controls="carbonView">1. Carbon Atom</button>
    <button role="tab" id="tabH" aria-selected="false" aria-controls="humanView">2. Humans and CO<sub>2</sub></button>
    <button role="tab" id="tabN" aria-selected="false" aria-controls="nitroView">3. Nitrogen Atom</button>
  </div>
</header>

<!-- ===================== TAB 1: CARBON ATOM ===================== -->
<main id="carbonView" class="view explore on" role="tabpanel" aria-labelledby="tabC">
  <div class="col">
    <div class="card stage">
      <svg id="cScene" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" aria-label="Landscape showing places where carbon is stored">
        <defs>
          <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9D8F2"/><stop offset="1" stop-color="#E7F5FC"/></linearGradient>
          <linearGradient id="gSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5BB2DE"/><stop offset="1" stop-color="#1F5E8E"/></linearGradient>
          <linearGradient id="gVol" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6E625A"/><stop offset=".55" stop-color="#8C7C70"/><stop offset="1" stop-color="#5E534C"/></linearGradient>
          <linearGradient id="gRock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9AE86"/><stop offset="1" stop-color="#A88B66"/></linearGradient>
          <radialGradient id="gMagma" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#FFD25A"/><stop offset=".5" stop-color="#F27B22"/><stop offset="1" stop-color="#B8321A"/></radialGradient>
          <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FC874"/><stop offset="1" stop-color="#5E9F4C"/></linearGradient>
          <pattern id="pLime" width="40" height="18" patternUnits="userSpaceOnUse"><rect width="40" height="18" fill="#EDE5CE"/><path d="M0 17.5H40M20 0V9M0 9H40M10 9V18M30 9V18" stroke="#C9BC98" stroke-width="1.2" fill="none"/></pattern>
          <pattern id="pSed" width="16" height="12" patternUnits="userSpaceOnUse"><rect width="16" height="12" fill="#B49A74"/><circle cx="4" cy="4" r="1.4" fill="#8F7655"/><circle cx="12" cy="9" r="1.1" fill="#D7C3A1"/></pattern>
          <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <marker id="mArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17232B"/></marker>
        </defs>

        <!-- ===== artwork (not clickable) ===== -->
        <g id="art" pointer-events="none">
          <rect width="1000" height="292" fill="url(#gSky)"/>
          <circle cx="935" cy="58" r="30" fill="#FFE07A"/>
          <!-- distant hills -->
          <path d="M150 292 C260 200 330 215 420 250 C480 230 540 240 600 292Z" fill="url(#gHill)" opacity=".55"/>
          <!-- CO2 molecules in the air -->
          <g id="mols" opacity=".75"></g>
          <!-- underground -->
          <rect y="290" width="1000" height="330" fill="url(#gRock)"/>
          <path d="M0 545 C200 535 420 552 700 540 C820 536 920 548 1000 542 V620 H0Z" fill="#8C7660"/>
          <!-- magma chamber + vent -->
          <path d="M103 292 C100 380 112 460 104 548" stroke="#D4561F" stroke-width="13" fill="none"/>
          <path d="M103 292 C100 380 112 460 104 548" stroke="#FFB648" stroke-width="5" fill="none"/>
          <ellipse cx="110" cy="578" rx="100" ry="36" fill="url(#gMagma)"/>
          <!-- coal seam + mine -->
          <path d="M228 392 C300 384 420 398 560 390 L562 420 C420 430 300 418 226 424Z" fill="#26231F"/>
          <path d="M260 400 l30 -2 M350 404 l40 -1 M450 401 l35 0" stroke="#5C5852" stroke-width="2"/>
          <rect x="541" y="292" width="8" height="100" fill="#6E6E6E"/>
          <!-- sea -->
          <path d="M588 291 L1000 291 V456 H690 Z" fill="url(#gSea)"/>
          <path d="M588 291 L1000 291" stroke="#D8F0FB" stroke-width="3"/>
          <path d="M588 291 L690 456 H1000 V460 H686 Z" fill="#D8C08E"/>
          <!-- sediments + limestone -->
          <path d="M690 458 H1000 V492 H711 Z" fill="url(#pSed)"/>
          <path d="M711 492 H1000 V538 H739 Z" fill="url(#pLime)"/>
          <path d="M600 470 C640 480 680 486 711 492 L739 538 C690 530 640 520 590 505Z" fill="url(#pLime)" opacity=".85"/>
          <!-- oil & gas pocket + rig -->
          <path d="M760 580 C780 556 880 552 905 578 C890 600 790 602 760 580Z" fill="#2F2418"/>
          <path d="M790 566 C810 560 860 560 880 566" stroke="#8FB4C8" stroke-width="5" fill="none" opacity=".65"/>
          <rect x="930" y="270" width="8" height="300" fill="#555"/>
          <rect x="912" y="258" width="46" height="14" fill="#7A7A7A"/>
          <path d="M920 258 L934 222 L948 258" stroke="#555" stroke-width="3" fill="none"/>
          <!-- land surface -->
          <path d="M0 286 H588 L592 292 H0Z" fill="#6DB257"/>
          <!-- soil band -->
          <path d="M196 292 H584 L604 330 C500 340 300 336 196 334Z" fill="#6A4A2E"/>
          <path d="M240 302 q6 14 -2 26 M330 300 q-8 14 2 28 M420 302 q8 12 0 26 M500 300 q-6 14 4 26" stroke="#3E2A18" stroke-width="2" fill="none"/>
          <path d="M280 318 q8 -6 16 0 t16 0" stroke="#D98A8A" stroke-width="4" fill="none" stroke-linecap="round"/>
          <g fill="#E8D7B5"><circle cx="455" cy="312" r="2"/><circle cx="372" cy="322" r="2"/><circle cx="530" cy="318" r="2"/></g>
          <!-- volcano -->
          <path d="M-10 292 L78 122 Q110 108 142 122 L232 292Z" fill="url(#gVol)"/>
          <path d="M84 126 Q110 136 136 126" stroke="#3E3530" stroke-width="5" fill="none"/>
          <path d="M104 132 C100 170 116 200 96 240 C90 255 100 270 92 290" stroke="#F06A1F" stroke-width="7" fill="none" stroke-linecap="round"/>
          <g fill="#B7B9BC" opacity=".9"><circle cx="112" cy="96" r="20"/><circle cx="132" cy="72" r="24"/><circle cx="160" cy="48" r="26"/><circle cx="190" cy="34" r="20"/></g>
          <!-- forest -->
          <g id="trees"></g>
          <!-- animals -->
          <g transform="translate(400 238)" fill="#8A5A34">
            <path d="M0 22 C8 12 34 10 48 16 L58 6 L62 2 L66 10 L60 16 C62 24 56 28 50 30 L50 50 L46 50 L45 32 C34 34 18 34 10 30 L9 50 L5 50 L5 30 C2 28 0 26 0 22Z"/>
            <path d="M60 4 L56 -8 M62 2 L68 -10 M56 -8 l-6 -4 M68 -10 l6 -4" stroke="#6B4527" stroke-width="2.4" fill="none"/>
          </g>
          <g transform="translate(470 270)" fill="#C9C1B4"><ellipse cx="10" cy="12" rx="12" ry="9"/><circle cx="22" cy="5" r="6"/><ellipse cx="22" cy="-5" rx="2.4" ry="7"/><ellipse cx="26" cy="-4" rx="2.4" ry="7"/></g>
          <!-- power plant, road, car -->
          <rect x="512" y="232" width="56" height="56" fill="#9AA3AA"/>
          <rect x="520" y="244" width="10" height="10" fill="#E9EEF1"/><rect x="540" y="244" width="10" height="10" fill="#E9EEF1"/>
          <rect x="550" y="186" width="12" height="52" fill="#7B848B"/>
          <g fill="#A7A9AB" opacity=".85"><circle cx="556" cy="176" r="10"/><circle cx="566" cy="158" r="13"/><circle cx="582" cy="138" r="15"/></g>
          <rect x="470" y="287" width="120" height="5" fill="#4E5357"/>
          <g transform="translate(478 272)"><rect x="0" y="6" width="34" height="11" rx="4" fill="#C83A2A"/><path d="M6 6 L11 0 H24 L29 6Z" fill="#C83A2A"/><circle cx="8" cy="18" r="4" fill="#222"/><circle cx="26" cy="18" r="4" fill="#222"/></g>
          <!-- algae (phytoplankton) -->
          <g id="algae"></g>
          <!-- fish -->
          <g id="fish"></g>
          <!-- coral + shells -->
          <g id="coral"></g>
        </g>

        <g id="cPlaces"></g>
        <g id="cTrail" pointer-events="none"></g>
        <g id="cAtom" pointer-events="none"><circle r="17" fill="#17232B" stroke="#fff" stroke-width="3"/><text class="atomtxt">C</text></g>
      </svg>
    </div>
  </div>
  <div class="col" id="cSide"></div>
</main>

<!-- ===================== TAB 2: HUMANS AND CO2 ===================== -->
<main id="humanView" class="view" role="tabpanel" aria-labelledby="tabH">
  <div class="col">
    <div class="card ctrls">
      <h2>Change what people do</h2>
      <div id="levers"></div>
      <div class="crow"><button id="resetModel">Reset to today</button></div>
    </div>
    <div class="card flowcard">
      <h2>Carbon going into and out of the air (this year)</h2>
      <div class="bars">
        <div class="barrow"><div class="lbl">INTO the air</div><div class="bar" id="barIn"></div></div>
        <div class="barrow"><div class="lbl">OUT of the air</div><div class="bar" id="barOut"></div></div>
      </div>
      <div class="key" id="flowKey"></div>
      <div class="verdict" id="verdict" aria-live="polite"></div>
    </div>
  </div>
  <div class="col">
    <div class="card graphcard">
      <h2>Carbon dioxide (CO<sub>2</sub>) in the air</h2>
      <div class="legend">
        <span><i style="border-color:var(--hist)"></i>Measured</span>
        <span><i style="border-color:var(--you);border-top-width:4px"></i>Your choices</span>
        <span><i style="border-color:var(--base);border-top-style:dashed"></i>If nothing changes</span>
        <span><i style="border-color:var(--pre);border-top-style:dotted"></i>Before factories</span>
      </div>
      <div class="plot"><svg id="graph" role="img" aria-label="Line graph of carbon dioxide in the air from 1960 to 2100"></svg></div>
      <div class="tiles">
        <div class="tile"><div class="k">CO<sub>2</sub> today (2025)</div><div class="v">425 <small>ppm</small></div></div>
        <div class="tile"><div class="k">CO<sub>2</sub> in 2050</div><div class="v" id="t2050">–</div></div>
        <div class="tile"><div class="k">CO<sub>2</sub> in 2100</div><div class="v" id="t2100">–</div></div>
      </div>
    </div>
  </div>
</main>

<!-- ===================== TAB 3: NITROGEN ATOM ===================== -->
<main id="nitroView" class="view explore" role="tabpanel" aria-labelledby="tabN">
  <div class="col">
    <div class="card stage">
      <svg id="nScene" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" aria-label="Farm field and soil showing places where nitrogen is found">
        <defs>
          <linearGradient id="nSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9D8F2"/><stop offset="1" stop-color="#E7F5FC"/></linearGradient>
          <linearGradient id="nSoil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A5636"/><stop offset="1" stop-color="#4E3520"/></linearGradient>
          <marker id="nArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17232B"/></marker>
        </defs>
        <g id="nArt" pointer-events="none">
          <rect width="1000" height="292" fill="url(#nSky)"/>
          <circle cx="940" cy="56" r="30" fill="#FFE07A"/>
          <!-- storm cloud + lightning -->

/* =============== Cycle explorer (used by the carbon and nitrogen tabs) =============== */
function Explorer(cfg){
  const side=$(cfg.side);
  const P=cfg.prefix;
  side.innerHTML=`
    <div class="card ptools">
      <label>Start in: <select id="${P}Start"></select></label>
      <button id="${P}Reset">Reset</button>
      <label style="flex-basis:100%">Challenge: <select id="${P}Chal"></select></label>
    </div>
    <div class="card loc" aria-live="polite">
      <div class="k">The ${cfg.atomWord} atom is in</div>
      <div class="n"><span id="${P}Name"></span><span id="${P}Badges"></span></div>
      <p id="${P}Store"></p>
    </div>
    <div class="card move" id="${P}Move" aria-live="polite"><h2 id="${P}MoveT"></h2><p id="${P}MoveP"></p></div>
    <div class="card journey">
      <div class="top"><h2>Journey <span id="${P}Count" style="font-weight:400;font-size:14px;color:var(--muted)"></span></h2></div>
      <div class="track" id="${P}Track"></div>
      <ol class="log" id="${P}Log"></ol>
    </div>`;
  const R=cfg.places,T=cfg.moves;
  const startSel=$(P+'Start'),chalSel=$(P+'Chal');
  Object.keys(R).forEach(id=>{const o=document.createElement('option');o.value=id;o.textContent=R[id].name;startSel.appendChild(o);});
  Object.entries(cfg.challenges).forEach(([k,c])=>{const o=document.createElement('option');o.value=k;o.textContent=c.label;chalSel.appendChild(o);});
  startSel.value=cfg.start;
  /* clickable places */
  const places=$(cfg.placesG),resEls={};
  const order=cfg.order||Object.keys(R);
  order.forEach(id=>{
    const r=R[id];
    const g=el('g',{class:'res','data-id':id,tabindex:0,role:'button','aria-label':r.name},places);
    r.shapes.forEach(([t,a])=>el(t,Object.assign({class:'hit'},a),g));
    resEls[id]=g;
    g.addEventListener('click',()=>tryMove(id));
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tryMove(id);}});
  });
  function pill(parent,x,y,text,small){
    const g=el('g',{class:'pill'+(small?' small':'')},parent);
    const rc=el('rect',{rx:12},g);const t=el('text',{x,y},g);t.textContent=text;
    let w;try{w=t.getComputedTextLength();}catch(e){w=0;}if(!w)w=text.length*(small?8:10.5);
    w+=small?14:22;const h=small?24:31;
    rc.setAttribute('x',x-w/2);rc.setAttribute('y',y-h/2);rc.setAttribute('width',w);rc.setAttribute('height',h);
  }
  /* labels go last so they paint above every hotspot; each label is clickable too */
  order.forEach(id=>{
    const r=R[id];
    const lg=el('g',{class:'res','data-id':id},places);
    pill(lg,r.label[0],r.label[1],r.name,false);
    (r.extra||[]).forEach(([x,y,t])=>pill(lg,x,y,t,true));
    lg.addEventListener('click',()=>tryMove(id));
    resEls[id+'_lab']=lg;
  });
  const S={start:cfg.start,cur:cfg.start,moves:[],visited:new Set(),used:new Set(),done:false};
  const atom=$(cfg.atomG),trailG=$(cfg.trailG);
  const atomPos=id=>{const [x,y]=R[id].label;return [x,y-34];};
  const placeAtom=(x,y)=>atom.setAttribute('transform',`translate(${x} ${y})`);
  let anim=null,busy=false;
  function animateAtom(from,to,done){
    const [x0,y0]=atomPos(from),[x1,y1]=atomPos(to);
    const cx=(x0+x1)/2,cy=Math.min(y0,y1)-60;
    const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(anim)cancelAnimationFrame(anim);
    if(reduce||document.hidden){placeAtom(x1,y1);done();return;}
    const t0=performance.now(),dur=700;
    const step=now=>{const t=Math.min(1,(now-t0)/dur);const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
      placeAtom((1-e)*(1-e)*x0+2*(1-e)*e*cx+e*e*x1,(1-e)*(1-e)*y0+2*(1-e)*e*cy+e*e*y1);
      if(t<1)anim=requestAnimationFrame(step);else{anim=null;done();}};
    anim=requestAnimationFrame(step);
  }
  function drawTrail(m){
    trailG.innerHTML='';if(!m)return;
    const [x0,y0]=atomPos(m.from),[x1,y1]=atomPos(m.to);
    const cx=(x0+x1)/2,cy=Math.min(y0,y1)-60;
    const p=el('path',{d:`M${x0} ${y0} Q${cx} ${cy} ${x1} ${y1}`,class:'trail','marker-end':`url(#${cfg.marker})`},trailG);
    let mid={x:(x0+2*cx+x1)/4,y:(y0+2*cy+y1)/4};
    try{const L=p.getTotalLength();const a=p.getPointAtLength(20),b=p.getPointAtLength(L-22);p.setAttribute('d',`M${a.x} ${a.y} Q${cx} ${cy} ${b.x} ${b.y}`);}catch(e){}
    const t=el('text',{x:mid.x,y:mid.y-8,class:'trailtxt'},trailG);t.textContent=T[m.from+'>'+m.to].name;
  }
  const nexts=id=>Object.keys(T).filter(k=>k.startsWith(id+'>')).map(k=>k.split('>')[1]);
  function render(){
    const can=new Set(nexts(S.cur));
    Object.keys(R).forEach(id=>[resEls[id],resEls[id+'_lab']].forEach(g=>{g.classList.toggle('can',can.has(id));g.classList.toggle('here',id===S.cur);}));
    const r=R[S.cur];
    $(P+'Name').textContent=r.name;
    $(P+'Badges').innerHTML=(r.group?`<span class="badge g-${r.group}">${(cfg.groupLong||cfg.groups)[r.group]}</span> `:'')+
      `<span class="badge ${r.living?'g-living':'g-nonliving'}">${r.living?'living (biotic)':'nonliving (abiotic)'}</span>`;
    $(P+'Store').innerHTML=r.store;
    $(P+'Count').textContent=`(${S.moves.length} move${S.moves.length===1?'':'s'})`;
    const tr=$(P+'Track');tr.innerHTML='';
    if(cfg.track==='groups'){
      Object.entries(cfg.groups).forEach(([g,n])=>{const s=document.createElement('span');s.className='chip '+g+(S.visited.has(g)?' v':'');s.textContent=n;tr.appendChild(s);});
      const s=document.createElement('span');s.textContent=S.visited.size+' of 4 visited';tr.appendChild(s);
    }else{
      cfg.track.forEach(n=>{const s=document.createElement('span');s.className='chip proc'+(S.used.has(n)?' v':'');s.textContent=n;tr.appendChild(s);});
      const s=document.createElement('span');s.textContent=cfg.track.filter(n=>S.used.has(n)).length+' of '+cfg.track.length+' used';tr.appendChild(s);
    }
    const log=$(P+'Log');log.innerHTML='';
    const li0=document.createElement('li');li0.innerHTML=`Started in <b>${R[S.start].name}</b>`;log.appendChild(li0);
    S.moves.forEach(m=>{const li=document.createElement('li');li.innerHTML=`<b>${R[m.from].name}</b> → <b>${R[m.to].name}</b><br><i>${T[m.from+'>'+m.to].name}</i>`;log.appendChild(li);});
    log.scrollTop=log.scrollHeight;
  }
  function setMove(kind,title,html){$(P+'Move').className='card move'+(kind?' '+kind:'');$(P+'MoveT').innerHTML=title;$(P+'MoveP').innerHTML=html;}
  function intro(){
    const ch=cfg.challenges[chalSel.value];
    if(ch.goal)setMove('','Challenge',ch.goal+' Click a glowing place to move the atom.');
    else setMove('','Click a glowing place','Glowing places show where the '+cfg.atomWord+' atom can go next. Click one to move the atom.');
  }
  function tags(t){return (t.slow?'<span class="tag slow">Takes millions of years</span>':'')+(t.people?'<span class="tag people">Caused by people</span>':'');}
  function tryMove(id){
    if(busy)return;
    if(id===S.cur){setMove('','You are here','The atom is already here. Click a glowing place to move it.');return;}
    const key=S.cur+'>'+id;
    if(!T[key]){
      const why=(cfg.wrong||{})[key]||`${cfg.atomWord[0].toUpperCase()+cfg.atomWord.slice(1)} can’t move straight from <b>${R[S.cur].name.toLowerCase()}</b> to <b>${R[id].name.toLowerCase()}</b>. Look for the glowing places.`;
      setMove('bad','Not a direct path',why);
      [resEls[id],resEls[id+'_lab']].forEach(g=>{g.classList.remove('shake');void g.getBBox();g.classList.add('shake');setTimeout(()=>g.classList.remove('shake'),400);});
      return;
    }
    const m={from:S.cur,to:id};busy=true;trailG.innerHTML='';
    animateAtom(S.cur,id,()=>{
      const t=T[key];
      S.cur=id;S.moves.push(m);S.visited.add(R[id].group);S.used.add(t.name);busy=false;
      drawTrail(m);render();
      const ch=cfg.challenges[chalSel.value];
      if(!S.done&&ch.done&&ch.done(S)){S.done=true;setMove('win','Challenge complete! ✓',`You did it in <b>${S.moves.length} move${S.moves.length===1?'':'s'}</b>. Last step: <b>${t.name}</b>. ${t.text}`);}
      else setMove('',`${t.name}`,`${t.text}<br>${tags(t)}`);
    });
  }
  function reset(){
    if(anim){cancelAnimationFrame(anim);anim=null;}busy=false;
    S.start=startSel.value;S.cur=S.start;S.moves=[];S.visited=new Set([R[S.start].group]);S.used=new Set();S.done=false;
    const [x,y]=atomPos(S.cur);placeAtom(x,y);drawTrail(null);render();intro();
  }
  $(P+'Reset').addEventListener('click',reset);
  startSel.addEventListener('change',reset);
  chalSel.addEventListener('change',()=>{const c=cfg.challenges[chalSel.value];if(c.start)startSel.value=c.start;reset();});
  reset();
  return {state:S,move:tryMove,reset};
}

/* =============== Tab 2: Humans and CO2 (simple, fully deterministic model) ===============
   Two-box model in ppm of CO2 above the 280 ppm of the 1700s. Xa = extra carbon in the air; Xs = extra carbon taken up by oceans, plants and soil.
   Uptake each year U = k*(Xa - Xs/beta). 2.12 billion tonnes of carbon = 1 ppm. 2025: 425 ppm, natural uptake 6.1 billion t/yr. */
const G=2.12,K=0.04,BETA=3,Y0=2025,Y1=2100,START=425;
const BASE={ff:10.0,def:1.1,vol:0.1,tree:2.0};
const OCEAN_SHARE=0.48;
const HIST=[[1960,317],[1965,320],[1970,326],[1975,331],[1980,339],[1985,346],[1990,354],[1995,361],[2000,370],[2005,380],[2010,390],[2015,401],[2020,414],[2025,425]];
function runModel(p){
  let Xa=START-280,Xs=BETA*(Xa-(6.1/G)/K);
  const rows=[];
  for(let y=Y0;y<=Y1;y++){
    const ff=BASE.ff*p.ff/100,def=BASE.def*p.def/100,vol=BASE.vol*p.vol/100,tree=BASE.tree*p.tree/100;
    const U=Math.max(0,K*(Xa-Xs/BETA)*G);
    const ocean=U*OCEAN_SHARE,land=U-ocean;
    const net=ff+def+vol-U-tree;
    rows.push({year:y,ppm:280+Xa,ff,def,vol,ocean,land,tree,net});
    Xa+=net/G;Xs+=U/G;
  }
  return rows;
}
const LEVERS=[
  {k:'ff',name:'Burning fossil fuels',help:'Coal, oil and natural gas in cars, furnaces and power plants.',opts:[[0,'None'],[50,'Half'],[100,'Today'],[200,'Double']],def:100},
  {k:'def',name:'Cutting down forests (deforestation)',help:'Cut trees are burned or rot. Fewer trees are left to absorb CO₂.',opts:[[0,'None'],[50,'Half'],[100,'Today'],[200,'Double']],def:100},
  {k:'tree',name:'Planting new trees',help:'New trees absorb CO₂ for photosynthesis.',opts:[[0,'None'],[50,'Some'],[100,'Lots']],def:0},
  {k:'vol',name:'Volcanoes erupting',help:'Volcanoes release carbon from the lithosphere.',opts:[[0,'None'],[100,'Normal'],[200,'Double'],[500,'5 times']],def:100},
];
const P={};
const lev=$('levers');
LEVERS.forEach(L=>{
  P[L.k]=L.def;
  const d=document.createElement('div');d.className='lever';
  d.innerHTML=`<div class="top"><span class="name">${L.name}</span></div><small>${L.help}</small><div class="seg" role="group" aria-label="${L.name}"></div>`;
  const seg=d.querySelector('.seg');
  L.opts.forEach(([v,t])=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.dataset.v=v;b.setAttribute('aria-pressed',v===L.def);
    b.addEventListener('click',()=>{P[L.k]=v;seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.v===v));updateModel();});seg.appendChild(b);});
  lev.appendChild(d);
});
$('resetModel').addEventListener('click',()=>{LEVERS.forEach(L=>{P[L.k]=L.def;lev.querySelectorAll(`[aria-label="${L.name}"] button`).forEach(x=>x.setAttribute('aria-pressed',+x.dataset.v===L.def));});updateModel();});
const baseline=runModel({ff:100,def:100,tree:0,vol:100});
let cur=baseline;
const FLOWS={ff:['Fossil fuels','#B8431C'],def:['Cutting forests','#8A5A34'],vol:['Volcanoes','#6E625A'],ocean:['Ocean','#1D4F91'],land:['Plants & soil','#2E9447'],tree:['New trees','#7CB342']};
(function(){const k=$('flowKey');Object.values(FLOWS).forEach(([n,c])=>{const s=document.createElement('span');s.innerHTML=`<i style="background:${c}"></i>${n}`;k.appendChild(s);});})();
function fillBar(id,parts,max){
  const b=$(id);b.innerHTML='';
  parts.forEach(([k,v])=>{if(v<=0)return;const s=document.createElement('span');s.style.width=(100*v/max)+'%';s.style.background=FLOWS[k][1];
    s.title=FLOWS[k][0];s.textContent=(100*v/max)>14?FLOWS[k][0]:'';b.appendChild(s);});
}
function updateModel(){
  cur=runModel(P);
  [2050,2100].forEach(y=>{$('t'+y).innerHTML=Math.round(cur[y-Y0].ppm)+' <small>ppm</small>';});
  const r=cur[0],inn=r.ff+r.def+r.vol,out=r.ocean+r.land+r.tree,max=Math.max(inn,out,12);
  fillBar('barIn',[['ff',r.ff],['def',r.def],['vol',r.vol]],max);
  fillBar('barOut',[['ocean',r.ocean],['land',r.land],['tree',r.tree]],max);
  const v=$('verdict');
  if(inn>out+0.05){v.className='verdict up';v.textContent='More carbon goes INTO the air than comes OUT. CO₂ in the air goes UP.';}
  else if(out>inn+0.05){v.className='verdict down';v.textContent='More carbon comes OUT of the air than goes IN. CO₂ in the air goes DOWN.';}
  else{v.className='verdict';v.textContent='Carbon in and carbon out are about the same. CO₂ in the air stays about the same.';}
  drawGraph();
}
const gsvg=$('graph');
const GX0=1960,GX1=2100,GY0=250,GY1=800;
function drawGraph(){
  const box=gsvg.getBoundingClientRect();const W=Math.max(240,box.width||600),H=Math.max(140,box.height||300);
  gsvg.setAttribute('viewBox',`0 0 ${W} ${H}`);gsvg.innerHTML='';
  const L=44,R=12,Tm=10,B=24;
  const x=v=>L+(v-GX0)/(GX1-GX0)*(W-L-R), y=v=>Tm+(1-(v-GY0)/(GY1-GY0))*(H-Tm-B);
  el('rect',{x:x(2025),y:Tm,width:x(2100)-x(2025),height:H-Tm-B,fill:'#F6F9FB'},gsvg);
  for(let v=GY0;v<=GY1;v+=50){
    el('line',{x1:L,x2:W-R,y1:y(v),y2:y(v),stroke:v%100===0?'#D5DEE3':'#EDF1F3','stroke-width':1},gsvg);
    if(v%100===0){const t=el('text',{x:L-5,y:y(v)+4,'text-anchor':'end','font-size':12.5,fill:'#4D5E67'},gsvg);t.textContent=v;}
  }
  for(let yr=GX0;yr<=GX1;yr+=20){
    el('line',{x1:x(yr),x2:x(yr),y1:Tm,y2:H-B,stroke:'#EDF1F3'},gsvg);
    const t=el('text',{x:x(yr),y:H-6,'text-anchor':'middle','font-size':12.5,fill:'#4D5E67'},gsvg);t.textContent=yr;
  }
  el('line',{x1:L,x2:L,y1:Tm,y2:H-B,stroke:'#17232B','stroke-width':1.5},gsvg);
  el('line',{x1:L,x2:W-R,y1:H-B,y2:H-B,stroke:'#17232B','stroke-width':1.5},gsvg);
  const ty=el('text',{x:L+6,y:Tm+14,'font-size':12.5,fill:'#4D5E67'},gsvg);ty.textContent='ppm';
  el('line',{x1:L,x2:W-R,y1:y(280),y2:y(280),stroke:'#2E9447','stroke-width':2,'stroke-dasharray':'2 4'},gsvg);
  const pts=a=>a.map(([a1,b1])=>`${x(a1).toFixed(1)},${y(b1).toFixed(1)}`).join(' ');
  el('polyline',{points:pts(HIST),fill:'none',stroke:'#2B2B2B','stroke-width':2.5},gsvg);
  el('polyline',{points:pts(baseline.map(r=>[r.year,r.ppm])),fill:'none',stroke:'#7D8A92','stroke-width':2,'stroke-dasharray':'7 5'},gsvg);
  el('polyline',{points:pts(cur.map(r=>[r.year,r.ppm])),fill:'none',stroke:'#D9480F','stroke-width':3.5,'stroke-linejoin':'round'},gsvg);
  const last=cur[cur.length-1];
  el('circle',{cx:x(2100),cy:y(last.ppm),r:5,fill:'#D9480F',stroke:'#fff','stroke-width':2},gsvg);
  const tl=el('text',{x:x(1962),y:y(280)-6,'font-size':12,fill:'#2E9447'},gsvg);tl.textContent='280 ppm before factories';
  const tf=el('text',{x:x(2027),y:Tm+14,'font-size':12,fill:'#4D5E67'},gsvg);tf.textContent='Future →';
}
if(window.ResizeObserver)new ResizeObserver(()=>{if($('humanView').classList.contains('on'))drawGraph();}).observe(gsvg);
updateModel();
window.__lab={carbon,nitrogen,runModel,P};
})();
