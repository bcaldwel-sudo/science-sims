<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roller Coaster Energy Lab</title>
<style>
:root{
  --navy:#0B1630; --ink:#1B2333; --card:#EEF2F8; --cream:#FFF4E3;
  --amber:#F4A43A; --amberDk:#B86F0E; --teal:#2A9D8F; --coral:#E4572E;
  --blue:#2F6FDE; --purple:#7B5EA7; --grey:#6B7486; --line:#D5DCE8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:15px}
h1,h2,.eq{font-family:Cambria,Caladea,Georgia,"Times New Roman",serif}
body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{flex:none;background:var(--navy);color:#fff;padding:7px 16px;display:flex;align-items:center;gap:14px;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:24px 24px}
header .kicker{font-size:12px;letter-spacing:.12em;color:var(--amber);font-weight:700}
header h1{margin:0;font-size:21px;font-weight:700;white-space:nowrap}
header .eqs{margin-left:auto;display:flex;gap:18px;font-family:Cambria,Georgia,serif;font-size:16px;color:#E6EBF5;white-space:nowrap}
.wrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px 12px 10px}
.stage{flex:1;min-height:200px;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;background:#fff}
canvas{display:block;position:absolute;left:0;top:0}
.banner{position:absolute;left:50%;top:8px;transform:translateX(-50%);max-width:min(760px,92%);padding:7px 14px;border-radius:10px;
  font-size:15px;line-height:1.3;text-align:center;display:none;border:2px solid}
.banner.ok{background:#E4F4F1;border-color:var(--teal);color:#14564E}
.banner.bad{background:#FCE9E3;border-color:var(--coral);color:#8A2A10}
.banner.info{background:var(--cream);border-color:var(--amber);color:#6B4206}
.panel{flex:none;display:grid;grid-template-columns:1.25fr 1fr 0.9fr;gap:8px}
.card{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;min-width:0}
.sliders{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;row-gap:2px}
.slider .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.slider label{font-weight:700;white-space:nowrap}
.slider output{font-family:Cambria,Georgia,serif;font-size:16px;font-weight:700;color:var(--navy);white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--navy);height:20px;margin:0}
.row{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;margin-top:6px}
button{font:inherit;font-weight:700;border-radius:9px;border:2px solid var(--navy);background:#fff;color:var(--navy);padding:4px 12px;cursor:pointer}
button.go{background:var(--navy);color:#fff}
button:disabled{opacity:.45;cursor:default}
.toggle{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;white-space:nowrap}
.toggle input{width:16px;height:16px;margin:0;accent-color:var(--navy)}
.fixed{font-size:13px;color:var(--grey);margin-top:4px}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ro{background:var(--card);border-radius:9px;padding:3px 9px;border-left:5px solid var(--grey);display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.ro .k{font-size:13px;color:var(--grey);font-weight:700;white-space:nowrap}
.ro .v{font-family:Cambria,Georgia,serif;font-size:19px;font-weight:700;white-space:nowrap}
.ro.h,.ro.eg{border-color:var(--coral)} .ro.sp,.ro.ek{border-color:var(--teal)}
.ro.th{border-color:var(--purple)} .ro.tot{border-color:var(--navy)}
.vneed{font-size:13px;color:var(--grey);margin-top:5px}
.bars{display:flex;gap:10px;align-items:flex-end;height:96px;padding:0 2px;border-bottom:2px solid var(--ink)}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bar .fill{width:100%;border-radius:5px 5px 0 0}
.bar .num{font-size:12px;font-weight:700;margin-bottom:2px;white-space:nowrap}
.barlabels{display:flex;gap:10px;padding:2px 2px 0}
.barlabels div{flex:1;text-align:center;font-size:13px;font-weight:700}
.small{font-size:12px;color:var(--grey);text-align:center}
sub,sup{font-size:70%}
/* small screens (phones, tablets): allow normal scrolling */
@media (max-width:900px), (max-height:520px){
  body{height:auto;overflow:auto}
  .stage{flex:none;height:56vw;min-height:220px}
  .panel{grid-template-columns:1fr}
  header .eqs{display:none}
}
@media (max-width:560px){.sliders{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <span class="kicker">SPH4C · ENERGY</span>
  <h1>Roller Coaster Energy Lab</h1>
  <div class="eqs"><span>E<sub>g</sub> = mgh</span><span>E<sub>k</sub> = ½mv²</span><span>E<sub>total</sub> = E<sub>g</sub> + E<sub>k</sub> + E<sub>th</sub></span><span>top of loop: v ≥ √(g r)</span></div>
</header>
<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div id="banner" class="banner"></div>
  </div>
  <div class="panel">
    <section class="card">
      <div class="sliders">
        <div class="slider"><div class="top"><label for="h0">Start height</label><output id="h0o"></output></div>
          <input type="range" id="h0" min="5" max="60" step="1" value="30"></div>
        <div class="slider"><div class="top"><label for="v0">Starting speed</label><output id="v0o"></output></div>
          <input type="range" id="v0" min="0" max="30" step="0.5" value="0"></div>
        <div class="slider"><div class="top"><label for="dl">Loop height</label><output id="dlo"></output></div>
          <input type="range" id="dl" min="10" max="40" step="1" value="20"></div>
        <div class="slider"><div class="top"><label for="h2">Second hill height</label><output id="h2o"></output></div>
          <input type="range" id="h2" min="5" max="60" step="1" value="20"></div>
      </div>
      <div class="row">
        <button id="run" class="go">▶ Run</button>
        <button id="pause">❚❚ Pause</button>
        <button id="reset">↺ Reset</button>
        <label class="toggle"><input type="checkbox" id="fric"><span>Friction (150 N)</span></label>
        <label class="toggle"><input type="checkbox" id="eline"><span>Max-height line</span></label>
      </div>
      <div class="fixed">Cart mass: <b>500 kg</b> (fixed) · g = 9.81 m/s² · loop height is the loop's diameter (r = height ÷ 2)</div>
    </section>
    <section class="card">
      <div class="readouts">
        <div class="ro h"><span class="k">Height, h</span><span class="v" id="rh">–</span></div>
        <div class="ro sp"><span class="k">Speed, v</span><span class="v" id="rv">–</span></div>
        <div class="ro eg"><span class="k">E<sub>g</sub></span><span class="v" id="reg">–</span></div>
        <div class="ro ek"><span class="k">E<sub>k</sub></span><span class="v" id="rek">–</span></div>
        <div class="ro th" id="rthbox"><span class="k">E<sub>th</sub></span><span class="v" id="rth">–</span></div>
        <div class="ro tot"><span class="k">Total</span><span class="v" id="rtot">–</span></div>
      </div>
      <div class="vneed" id="vneed"></div>
    </section>
    <section class="card">
      <div class="bars">
        <div class="bar"><div class="num" id="beg"></div><div class="fill" id="fbeg" style="background:var(--coral)"></div></div>
        <div class="bar"><div class="num" id="bek"></div><div class="fill" id="fbek" style="background:var(--teal)"></div></div>
        <div class="bar"><div class="num" id="bth"></div><div class="fill" id="fbth" style="background:var(--purple)"></div></div>
        <div class="bar"><div class="num" id="btot"></div><div class="fill" id="fbtot" style="background:var(--navy)"></div></div>
      </div>
      <div class="barlabels"><div style="color:var(--coral)">E<sub>g</sub></div><div style="color:var(--teal)">E<sub>k</sub></div><div style="color:var(--purple)">E<sub>th</sub></div><div style="color:var(--navy)">Total</div></div>
      <div class="small">Energy in kJ</div>
    </section>
  </div>
</div>

<script>
(function(){
"use strict";
var G = 9.81, M = 500, F_FRIC = 150;
var X_CREST = 6, L_DROP = 50, X_LOOP = 86, X_HILL0 = 116, W_HILL = 80, X_END = 222, WORLD_W = 228, U0 = 0.06;

/* ---------- Track ---------- */
function buildTrack(p){
  var r = p.dl/2, pts = [], s = 0;
  function add(x,y,seg){
    if(pts.length){ var q = pts[pts.length-1]; s += Math.hypot(x-q.x, y-q.y); }
    pts.push({x:x,y:y,s:s,seg:seg});
  }
  var i, n, u, w;
  // drop (from crest)
  var norm = 1 + Math.cos(Math.PI*U0);
  n = 400;
  for(i=0;i<=n;i++){ u=i/n; w=U0+(1-U0)*u; add(X_CREST+L_DROP*u, p.h0*(1+Math.cos(Math.PI*w))/norm, 'drop'); }
  // flat to loop
  n = 60; for(i=1;i<=n;i++){ add(X_CREST+L_DROP+(X_LOOP-X_CREST-L_DROP)*i/n, 0, 'flat1'); }
  var sLoop0 = s;
  // loop (analytic, also sampled for drawing)
  n = 360; for(i=1;i<=n;i++){ var a=2*Math.PI*i/n; pts.push({x:X_LOOP+r*Math.sin(a), y:r-r*Math.cos(a), s:sLoop0+r*a, seg:'loop'}); }
  s = sLoop0 + 2*Math.PI*r;
  var sLoop1 = s;
  n = 60; for(i=1;i<=n;i++){ add(X_LOOP+(X_HILL0-X_LOOP)*i/n, 0, 'flat2'); }
  var sHill0 = s;
  n = 480; for(i=1;i<=n;i++){ u=i/n; add(X_HILL0+W_HILL*u, p.h2*(1-Math.cos(2*Math.PI*u))/2, 'hill'); }
  var sHill1 = s;
  n = 60; for(i=1;i<=n;i++){ add(X_HILL0+W_HILL+(X_END-X_HILL0-W_HILL)*i/n, 0, 'flat3'); }
  return {pts:pts, r:r, sLoop0:sLoop0, sLoop1:sLoop1, sHill0:sHill0, sHill1:sHill1, sEnd:s, p:p};
}
function at(T, s){
  if(s < 0) s = 0; if(s > T.sEnd) s = T.sEnd;
  if(s > T.sLoop0 && s < T.sLoop1){
    var a = (s - T.sLoop0)/T.r;
    return {x:X_LOOP+T.r*Math.sin(a), y:T.r-T.r*Math.cos(a), slope:Math.sin(a), tx:Math.cos(a), ty:Math.sin(a), loop:true, a:a, seg:'loop'};
  }
  var P = T.pts, lo = 0, hi = P.length-1;
  while(hi-lo > 1){ var mid=(lo+hi)>>1; if(P[mid].s <= s) lo=mid; else hi=mid; }
  var A = P[lo], B = P[hi];
  if(B.seg==='loop' || A.seg==='loop'){ // just at loop boundaries
    return {x:X_LOOP, y:0, slope:0, tx:1, ty:0, loop:false, seg:'flat'};
  }
  var ds = B.s - A.s || 1e-9, t = (s - A.s)/ds;
  var dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx,dy) || 1e-9;
  return {x:A.x+dx*t, y:A.y+dy*t, slope:dy/ds, tx:dx/L, ty:dy/L, loop:false, seg:B.seg};
}

/* ---------- Simulation ---------- */
function newSim(p){
  var T = buildTrack(p);
  return {T:T, p:p, s:0, v:p.v0, Eth:0, E0:M*G*p.h0 + 0.5*M*p.v0*p.v0, mode:'track', t:0,
          x:X_CREST, y:p.h0, vx:0, vy:0, dist:0, maxHill:0, maxLoop:0, topSpeed:null, passedTop:false,
          reversed:null, still:0, outcome:null, failH:null, failV:null};
}
function step(S, dt){
  if(S.outcome) return;
  var T = S.T, fa = S.p.fric ? F_FRIC/M : 0;
  S.t += dt;
  if(S.mode === 'air'){
    S.vy -= G*dt; S.x += S.vx*dt; S.y += S.vy*dt;
    if(S.y <= 0){ S.y = 0; S.outcome = 'fell'; }
    return;
  }
  var q = at(T, S.s), v = S.v, a;
  if(Math.abs(v) < 1e-9){
    var gs = -G*q.slope;
    if(Math.abs(gs) <= fa) a = 0; else a = gs - Math.sign(gs)*fa;
  } else a = -G*q.slope - Math.sign(v)*fa;
  var vn = v + a*dt, ds = 0.5*(v+vn)*dt;
  if(fa && v*vn < 0){ vn = 0; } // friction: stop rather than overshoot through zero
  S.s += ds; S.dist += Math.abs(ds); S.Eth += M*fa*Math.abs(ds);
  q = at(T, S.s);
  var Ek = S.E0 - M*G*q.y - S.Eth;
  if(Ek > 0 && Math.abs(vn) > 0.05) vn = Math.sign(vn)*Math.sqrt(2*Ek/M); // keep energy exact
  // reversal
  if(v > 0 && vn <= 0 && !S.reversed){
    if(q.loop){ S.reversed = 'loop'; S.failH = q.y; }
    else if(q.seg === 'hill'){ S.reversed = 'hill'; S.failH = q.y; }
  }
  S.v = vn; S.x = q.x; S.y = q.y;
  if(q.seg === 'hill') S.maxHill = Math.max(S.maxHill, q.y);
  if(q.loop){
    S.maxLoop = Math.max(S.maxLoop, q.y);
    if(!S.passedTop && q.a >= Math.PI){ S.passedTop = true; S.topSpeed = Math.abs(vn); }
    var Nm = vn*vn/T.r + G*Math.cos(q.a); // normal force per kg
    if(Nm < -0.02 && vn > 0){
      S.mode = 'air'; S.failH = q.y; S.failV = Math.abs(vn);
      S.vx = vn*q.tx; S.vy = vn*q.ty; return;
    }
  }
  if(S.s >= T.sEnd){ S.s = T.sEnd; S.outcome = 'success'; return; }
  if(S.reversed === 'loop' && S.s < T.sLoop0 - 4){ S.outcome = 'loopBack'; return; }
  if(S.reversed === 'hill' && S.s < T.sHill0 - 4){ S.outcome = 'hillBack'; return; }
  if(Math.abs(S.v) < 0.03){ S.still += dt; } else S.still = 0;
  if(S.still > 1.2){
    S.failH = q.y;
    S.outcome = (q.seg === 'hill' && Math.abs(q.slope) < 0.05) ? 'hillTop' : 'stopped';
  }
  if(S.t > 400) S.outcome = 'stopped';
}
function simulate(p){
  var S = newSim(p), n = 0;
  while(!S.outcome && n < 400000){ step(S, 0.002); n++; }
  return S;
}

/* ---------- UI ---------- */
var $ = function(id){ return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d');
var S = null, running = false, lastT = null;

function params(){
  return {h0:+$('h0').value, v0:+$('v0').value, dl:+$('dl').value, h2:+$('h2').value, fric:$('fric').checked};
}
function kJ(E){ return (E/1000).toFixed(1) + ' kJ'; }
function fmt(x,d){ return (Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toFixed(d); }

function labels(){
  var p = params();
  $('h0o').textContent = p.h0 + ' m';
  $('v0o').textContent = fmt(p.v0,1) + ' m/s';
  $('dlo').textContent = p.dl + ' m (r = ' + fmt(p.dl/2,1) + ' m)';
  $('h2o').textContent = p.h2 + ' m';
}
function reset(){
  running = false; lastT = null;
  labels();
  S = newSim(params());
  hideBanner();
  draw(); readouts();
  $('run').disabled = false;
}
function showBanner(cls, html){ var b=$('banner'); b.className='banner '+cls; b.innerHTML=html; b.style.display='block'; }
function hideBanner(){ $('banner').style.display='none'; }

function state(){
  var Eg = M*G*S.y, Ek = Math.max(0, S.E0 - Eg - S.Eth), v = Math.sqrt(2*Ek/M);
  return {Eg:Eg, Ek:Ek, v:v};
}
function readouts(){
  var st = state();
  $('rh').textContent = fmt(S.y,1) + ' m';
  $('rv').textContent = fmt(st.v,1) + ' m/s';
  $('reg').textContent = kJ(st.Eg);
  $('rek').textContent = kJ(st.Ek);
  $('rth').textContent = kJ(S.Eth);
  $('rtot').textContent = kJ(S.E0);
  $('rthbox').style.opacity = S.p.fric ? 1 : 0.45;
  var max = S.E0 || 1;
  function bar(id, E){ $('f'+id).style.height = Math.max(0, Math.min(100, 100*E/max)) + '%'; $(id).textContent = (E/1000).toFixed(0); }
  bar('beg', st.Eg); bar('bek', st.Ek); bar('bth', S.Eth); bar('btot', S.E0);
  var vmin = Math.sqrt(G*S.T.r);
  $('vneed').innerHTML = 'Speed needed at the top of the loop: v = √(g r) = <b>' + fmt(vmin,1) + ' m/s</b>' +
    (S.topSpeed !== null ? ' &nbsp;·&nbsp; this run: <b style="color:' + (S.topSpeed >= vmin - 0.005 ? 'var(--teal)' : 'var(--coral)') + '">' + fmt(S.topSpeed,1) + ' m/s</b>' : '');
}

function finish(){
  running = false;
  var r = S.T.r, vmin = Math.sqrt(G*r), o = S.outcome;
  readouts();
  if(o === 'success'){
    var vEnd = state().v;
    showBanner('ok', '<b>Made it!</b> Speed at the top of the loop was ' + fmt(S.topSpeed,1) + ' m/s (needed ' + fmt(vmin,1) + ' m/s). Finish speed: ' + fmt(vEnd,1) + ' m/s.' + (S.p.fric ? ' Friction made ' + kJ(S.Eth) + ' of thermal energy.' : ''));
  } else if(o === 'fell'){
    showBanner('bad', '<b>Fell off the loop</b> at h = ' + fmt(S.failH,1) + ' m, moving only ' + fmt(S.failV,1) + ' m/s. It needs at least ' + fmt(vmin,1) + ' m/s at the top. Start higher or faster.');
  } else if(o === 'loopBack'){
    showBanner('bad', '<b>Not enough energy for the loop.</b> It only climbed to ' + fmt(S.failH,1) + ' m (E<sub>k</sub> = 0 there) and slid back down.');
  } else if(o === 'hillBack' && S.failH >= S.p.h2 - 0.05){
    showBanner('info', '<b>Stopped right at the top of hill 2, then rolled back!</b> All of its energy was E<sub>g</sub>, so v = 0 at the top. A tiny bit more energy would get it over.');
  } else if(o === 'hillBack'){
    showBanner('bad', '<b>Rolled back from hill 2.</b> It only reached ' + fmt(S.failH,1) + ' m, but the hill is ' + S.p.h2 + ' m tall. All its kinetic energy became E<sub>g</sub> before the top.');
  } else if(o === 'hillTop'){
    showBanner('info', '<b>Stuck at the very top of hill 2!</b> All of its energy is E<sub>g</sub>, so v = 0. A tiny bit more energy would get it over.');
  } else {
    showBanner('bad', '<b>Stopped.</b> Friction turned all the kinetic energy into thermal energy (h = ' + fmt(S.failH||S.y,1) + ' m).');
  }
  $('run').disabled = true;
}

function loop(ts){
  if(!running){ lastT = null; return; }
  if(lastT === null) lastT = ts;
  var simDt = Math.min(0.05, (ts - lastT)/1000); lastT = ts;
  var n = Math.ceil(simDt/0.001);
  for(var i=0;i<n && !S.outcome;i++) step(S, simDt/n);
  draw(); readouts();
  if(S.outcome){ finish(); draw(); return; }
  requestAnimationFrame(loop);
}

/* ---------- Drawing ---------- */
var VIEW = {};
function resize(){
  var st = $('stage'), w = st.clientWidth || 1240, h = st.clientHeight || 400, dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  VIEW.w = w; VIEW.h = h;
  var left = 46, right = 12, top = 14, bottom = 26;
  VIEW.k = Math.min((w-left-right)/WORLD_W, (h-top-bottom)/64);
  VIEW.ox = left + Math.max(0, ((w-left-right) - WORLD_W*VIEW.k)/2);
  VIEW.oy = h - bottom;
  if(S) draw();
}
function X(x){ return VIEW.ox + x*VIEW.k; }
function Y(y){ return VIEW.oy - y*VIEW.k; }

function draw(){
  if(!S) return;
  var w = VIEW.w, h = VIEW.h, k = VIEW.k, T = S.T, p = S.p;
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,w,h);
  // grid + ruler
  for(var gy=5; gy<=65; gy+=5){
    var yy = Y(gy); if(yy < 4) break;
    ctx.strokeStyle = gy%10===0 ? '#E3E8F1' : '#F2F4F8'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(VIEW.ox, yy); ctx.lineTo(w-6, yy); ctx.stroke();
  }
  // ground
  ctx.fillStyle = '#EEF2F8'; ctx.fillRect(0, Y(0), w, h-Y(0));
  ctx.strokeStyle = '#1B2333'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0,Y(0)); ctx.lineTo(w,Y(0)); ctx.stroke();
  ctx.font = '12px Calibri, Arial, sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#6B7486';
  for(gy=0; gy<=60; gy+=10){ if(Y(gy) > 8) ctx.fillText(gy + ' m', VIEW.ox-6, Y(gy) - (gy===0 ? 7 : 0)); }
  // supports
  ctx.strokeStyle = '#C3CBD8'; ctx.lineWidth = 1.5;
  var P = T.pts, lastX = -99;
  for(var i=0;i<P.length;i++){
    var q = P[i];
    if(q.seg==='loop' || q.y < 0.5) continue;
    if(q.x - lastX >= 5){ ctx.beginPath(); ctx.moveTo(X(q.x),Y(q.y)); ctx.lineTo(X(q.x),Y(0)); ctx.stroke(); lastX = q.x; }
  }
  // loop struts
  var r = T.r;
  [[-0.9,-1.25],[0.9,1.25]].forEach(function(pr){
    var ax = X_LOOP + r*Math.sin(Math.PI/2*Math.sign(pr[0]))*0.98;
    ctx.beginPath(); ctx.moveTo(X(ax), Y(r)); ctx.lineTo(X(X_LOOP + pr[1]*r), Y(0)); ctx.stroke();
  });
  // start platform
  ctx.fillStyle = '#D5DCE8'; ctx.fillRect(X(0), Y(p.h0), X(X_CREST)-X(0), 5);
  ctx.strokeStyle = '#C3CBD8'; ctx.beginPath(); ctx.moveTo(X(1),Y(p.h0)); ctx.lineTo(X(1),Y(0)); ctx.stroke();
  // finish
  ctx.fillStyle = '#FFF4E3'; ctx.fillRect(X(X_END-10), Y(0)-6, X(X_END)-X(X_END-10), 6);
  ctx.fillStyle = '#B86F0E'; ctx.textAlign='center'; ctx.textBaseline='alphabetic'; ctx.font='bold 12px Calibri, Arial, sans-serif';
  ctx.fillText('FINISH', X(X_END-5), Y(0)+16);
  // max-height line
  if($('eline').checked){
    var H = (S.E0 - S.Eth)/(M*G);
    ctx.setLineDash([8,6]); ctx.strokeStyle = '#7B5EA7'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(VIEW.ox, Y(H)); ctx.lineTo(w-6, Y(H)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#7B5EA7'; ctx.textAlign='right'; ctx.font='bold 12px Calibri, Arial, sans-serif';
    ctx.fillText('max height possible = ' + fmt(H,1) + ' m', w-10, Y(H)-5);
  }
  // track rails
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  [[7,'#0B1630'],[2.5,'#6B7486']].forEach(function(st){
    ctx.strokeStyle = st[1]; ctx.lineWidth = st[0];
    ctx.beginPath();
    for(var i=0;i<P.length;i++){ var q=P[i]; if(i===0) ctx.moveTo(X(q.x),Y(q.y)); else ctx.lineTo(X(q.x),Y(q.y)); }
    ctx.stroke();
  });
  // labels on track features
  ctx.font = 'bold 13px Calibri, Arial, sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#0B1630';
  ctx.fillText('loop ' + p.dl + ' m', X(X_LOOP), Math.max(30, Y(p.dl)-26));
  ctx.fillText('hill ' + p.h2 + ' m', X(X_HILL0+W_HILL/2), Math.max(14, Y(p.h2)-10));
  // loop-top speed needed
  ctx.font = '12px Calibri, Arial, sans-serif'; ctx.fillStyle = '#E4572E';
  ctx.fillText('needs ≥ ' + fmt(Math.sqrt(G*r),1) + ' m/s at top', X(X_LOOP), Math.max(46, Y(p.dl)-10));
  // max hill marker
  if(S.maxHill > 0.2 && S.outcome && S.outcome!=='success'){
    var xs = null; for(var j=0;j<P.length;j++){ if(P[j].seg==='hill' && P[j].y >= S.maxHill-0.05){ xs=P[j].x; break; } }
    if(xs!==null){ ctx.strokeStyle='#E4572E'; ctx.setLineDash([4,4]); ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(X(xs)-30,Y(S.maxHill)); ctx.lineTo(X(xs)+30,Y(S.maxHill)); ctx.stroke(); ctx.setLineDash([]); }
  }
  drawCart();
}
function drawCart(){
  var T = S.T, k = VIEW.k, x, y, tx, ty, v;
  if(S.mode === 'air'){
    var sp = Math.hypot(S.vx,S.vy) || 1; x = S.x; y = S.y; tx = S.vx/sp; ty = S.vy/sp; v = sp;
    if(S.outcome === 'fell'){ tx = 1; ty = 0; }
  } else {
    var q = at(T, S.s); x = q.x; y = q.y; tx = q.tx; ty = q.ty; v = S.v;
  }
  var nx = -ty, ny = tx; // left normal (up on flats, inward in loop)
  var Lc = Math.max(22, 3.6*k), Hc = Math.max(12, 1.9*k), lift = 4;
  var cx = X(x) , cy = Y(y);
  // height line
  ctx.setLineDash([5,4]); ctx.strokeStyle = '#E4572E'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, Y(0)); ctx.stroke(); ctx.setLineDash([]);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(Math.atan2(-ty, tx));
  // in screen coords the normal "up" is -y after rotation
  ctx.translate(0, -lift);
  ctx.fillStyle = '#F4A43A'; ctx.strokeStyle = '#0B1630'; ctx.lineWidth = 2;
  roundRect(-Lc/2, -Hc, Lc, Hc, 4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#0B1630';
  ctx.beginPath(); ctx.arc(-Lc/3, 0, 3.5, 0, 2*Math.PI); ctx.fill();
  ctx.beginPath(); ctx.arc(Lc/3, 0, 3.5, 0, 2*Math.PI); ctx.fill();
  // seat
  ctx.fillStyle = '#FFF4E3'; roundRect(-Lc/2+4, -Hc+3, Lc*0.38, Hc*0.45, 2); ctx.fill();
  ctx.restore();
  // velocity arrow
  var st = state(), vs = st.v, dir = (S.mode==='air') ? 1 : (v < 0 ? -1 : 1);
  if(vs > 0.3 && !S.outcome){
    var len = Math.min(100, 8 + vs*3.5), ex = tx*dir, ey = -ty*dir;
    var px = cx + nx*(Hc/2+lift), pyy = cy - ny*(Hc/2+lift); // cart centre
    var sx0 = px + ex*(Lc/2+2), sy0 = pyy + ey*(Lc/2+2);
    ctx.strokeStyle = '#2A9D8F'; ctx.fillStyle = '#2A9D8F'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(sx0, sy0); ctx.lineTo(sx0 + ex*len, sy0 + ey*len); ctx.stroke();
    var hx = sx0 + ex*len, hy = sy0 + ey*len, a = Math.atan2(ey, ex);
    ctx.beginPath(); ctx.moveTo(hx + Math.cos(a)*8, hy + Math.sin(a)*8);
    ctx.lineTo(hx + Math.cos(a+2.4)*9, hy + Math.sin(a+2.4)*9);
    ctx.lineTo(hx + Math.cos(a-2.4)*9, hy + Math.sin(a-2.4)*9); ctx.closePath(); ctx.fill();
    ctx.font = 'bold 13px Calibri, Arial, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    var lx = hx + ex*24, ly = hy + ey*14;
    ctx.fillStyle = 'rgb(255,255,255)'; var tw = ctx.measureText('00.0 m/s').width; ctx.fillRect(lx-tw/2-2, ly-8, tw+4, 16);
    ctx.fillStyle = '#2A9D8F'; ctx.fillText(fmt(vs,1) + ' m/s', lx, ly);
  }
  // height label
  ctx.fillStyle = '#E4572E'; ctx.font = 'bold 13px Calibri, Arial, sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  if(y > 2) ctx.fillText('h = ' + fmt(y,1) + ' m', cx + 6, (cy + Y(0))/2);
  if(S.outcome === 'fell'){
    ctx.fillStyle = '#E4572E'; ctx.font = 'bold 16px Calibri, Arial, sans-serif'; ctx.textAlign='center';
    ctx.fillText('CRASH!', cx, Y(0) - 30);
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

/* ---------- Wiring ---------- */
['h0','v0','dl','h2','fric'].forEach(function(id){ $(id).addEventListener('input', reset); });
$('eline').addEventListener('change', draw);
$('run').onclick = function(){
  if(!S || S.outcome) reset();
  if(running) return;
  hideBanner(); running = true; lastT = null; requestAnimationFrame(loop);
};
$('pause').onclick = function(){ running = false; };
$('reset').onclick = reset;
window.addEventListener('resize', resize);

resize();
reset();
window.__coaster = {simulate:simulate, step:step, newSim:newSim, at:at};
})();
</script>
</body>
