<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photosynthesis Lab</title>
<style>
/* Layout: lab bench diagram + sliders on the left, bar graph on the right; one laptop screen, no page scroll. */
:root{
  color-scheme:light;
  --bg:#EEF3EF; --surface:#FFFFFF; --card:#E6EEE8; --ink:#16251C; --muted:#56685C; --line:#CFDBD2;
  --header:#12352A; --accent:#1F7A4D; --on-accent:#FFFFFF; --amber:#F2B63D;
  --water:#D4EAF5; --water2:#B9DCEE; --glass:#7E9AA8; --glassfill:rgba(255,255,255,.35);
  --gas:#FFFFFF; --leaf:#2F8A3E; --leaf2:#5DB34F; --stem:#3E7A2E;
  --metal:#7C878F; --metal2:#B5BEC4; --bench:#C9A97E; --bench2:#A88458; --box:#3A4650; --screen:#0F2A1E; --screentext:#7CF0A6;
  --red:#D33A3A; --tick:#4A5A62; --grid1:#DCE5DF; --grid2:#EEF3EF; --pt:#1F7A4D;
  --b1:#E8A317; --b2:#D33A3A; --b3:#3A6FC4; --b4:#1F8A4D;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:15px}
h1,h2,.num{font-family:Cambria,Caladea,Georgia,"Times New Roman",serif}
body{display:flex;flex-direction:column;overflow:hidden}
header{flex:none;background:var(--header);color:#fff;padding:7px 16px;display:flex;align-items:center;gap:14px}
header h1{margin:0;font-size:21px;font-weight:700;white-space:nowrap}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:8px;padding:8px 12px 10px}
.col{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.card{border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.stage{flex:1;min-height:180px;position:relative;overflow:hidden}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.controls{flex:none;padding:7px 12px 8px;display:grid;grid-template-columns:1fr 1fr;column-gap:18px;row-gap:3px}
.slider .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.slider label{font-weight:700;white-space:nowrap}
.numin{font-family:Cambria,Georgia,serif;font-size:16px;font-weight:700;color:var(--accent);white-space:nowrap}
.numin input{width:62px;font:inherit;color:var(--accent);background:var(--surface);border:2px solid var(--line);border-radius:7px;padding:0 4px;text-align:right;font-variant-numeric:tabular-nums}
.numin input:hover{border-color:var(--accent)}
.slider output{font-family:Cambria,Georgia,serif;font-size:16px;font-weight:700;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:20px;margin:0}
input[type=range]:disabled{opacity:.35}
#wl{-webkit-appearance:none;appearance:none;height:10px;border-radius:6px;margin:5px 0;background:linear-gradient(90deg,#7a00b0 0%,#3b00ff 13%,#0077ff 30%,#00e5d0 37%,#22dd00 45%,#c8f000 55%,#ffd000 58%,#ff7a00 66%,#ff0000 75%,#a00000 100%)}
#wl::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:22px;border-radius:5px;background:var(--surface);border:2px solid var(--ink);cursor:pointer}
#wl::-moz-range-thumb{width:12px;height:20px;border-radius:5px;background:var(--surface);border:2px solid var(--ink);cursor:pointer}
.seg{display:inline-flex;border:2px solid var(--accent);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:2px 10px;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
button{font:inherit;font-weight:700;border-radius:9px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);padding:4px 12px;cursor:pointer;white-space:nowrap}
button.go{background:var(--accent);color:var(--on-accent)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.graphcard{flex:1;min-height:220px;display:flex;flex-direction:column;padding:8px 14px 10px;gap:6px}
.graphcard h2{margin:0;font-size:16px}
.plot{flex:1;min-height:0;position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:0 5%;padding:0 2% 0 66px;border-bottom:2px solid var(--ink)}
.bcol{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.bar{width:70%;max-width:90px;border-radius:7px 7px 0 0;transition:height .35s ease;height:0;position:relative}
.bval{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:3px;font-family:Cambria,Georgia,serif;font-weight:700;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink);visibility:hidden}
.plot.nums .bval{visibility:visible}
.typ{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.75;pointer-events:none}
.typ span{position:absolute;left:0;width:58px;top:0;transform:translateY(-50%);font-size:12px;line-height:1.1;text-align:right;color:var(--muted);font-weight:700;background:var(--surface);padding:1px 4px 1px 0}
.blabels{display:grid;grid-template-columns:repeat(4,1fr);gap:0 5%;padding:0 2% 0 66px;text-align:center;font-weight:700;font-size:14px;line-height:1.15}
.blabels small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.bfoot{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.tip{font-size:12.5px;color:var(--muted)}
.b-light{background:var(--b1)} .b-temp{background:var(--b2)} .b-co2{background:var(--b3)} .b-o2{background:var(--b4)}
sub,sup{font-size:70%}
/* SVG diagram colours */
.bench{fill:var(--bench)} .bench2{fill:var(--bench2)}
.glass{fill:var(--glassfill);stroke:var(--glass);stroke-width:2}
.glassline{fill:none;stroke:var(--glass);stroke-width:2}
.water{fill:var(--water)} .water2{fill:var(--water2)}
.metal{fill:var(--metal)} .metal2{fill:var(--metal2)}
.box{fill:var(--box)} .screen{fill:var(--screen)} .stxt{fill:var(--screentext);font:700 13px Consolas,"Courier New",monospace}
.lbl{fill:var(--muted);font:700 11.5px Calibri,Carlito,"Segoe UI",Arial,sans-serif}
.lead{stroke:var(--muted);stroke-width:1;fill:none;opacity:.7}
.tick{stroke:var(--tick);stroke-width:1}
.ticktxt{fill:var(--tick);font:700 9px Calibri,Carlito,Arial,sans-serif}
.gasfill{fill:var(--gas)}
.bubble{fill:var(--gas);stroke:var(--glass);stroke-width:.6;opacity:.9}
.redliq{fill:var(--red)}
/* small screens: allow normal scrolling */
@media (max-width:900px), (max-height:500px){
  body{overflow:auto;height:auto}
  .wrap{grid-template-columns:1fr}
  .stage{flex:none;height:62vw;min-height:240px}
  .graphcard{flex:none;height:340px}
}
@media (max-width:560px){.controls{grid-template-columns:1fr}}

</style>
</head>
<body>
<header>
  <h1>Photosynthesis Lab</h1>

<div class="wrap">
  <div class="col">
    <div class="card stage" id="stage">
      <svg id="lab" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Pondweed under a glass funnel in a beaker of water. A lamp shines on it from the left. Oxygen bubbles rise into an upside-down measuring tube.">

        <g class="tick"><line x1="272" y1="200" x2="282" y2="200"/><line x1="272" y1="240" x2="282" y2="240"/><line x1="272" y1="280" x2="282" y2="280"/><line x1="272" y1="320" x2="282" y2="320"/></g>
        <!-- thermometer -->

        <!-- CO2 meter on the bench, probe in the water -->

        <rect class="metal" x="292" y="150" width="8" height="70" rx="3"/>
        <rect class="box" x="176" y="316" width="84" height="64" rx="6"/>
        <rect class="screen" x="184" y="324" width="68" height="22" rx="3"/>
        <text class="stxt" x="218" y="340" text-anchor="middle" id="co2Txt">500 ppm</text>

        <circle id="glow" cx="140" cy="171" r="40" fill="url(#glowG)" opacity=".5"/>

        <!-- labels -->
        <g id="labels">
          <text class="lbl" x="96" y="124">Lamp</text>
          <text class="lbl" x="164" y="126" id="filterLbl" opacity="0">Colour filter</text>
          <text class="lbl" x="296" y="36" text-anchor="end">Measuring tube</text>

          <path class="lead" d="M300 40 L366 54"/>
          <text class="lbl" x="530" y="214">Funnel</text>
          <path class="lead" d="M528 210 L432 290"/>

      </svg>
    </div>
    <section class="card controls" aria-label="Experiment controls">
      <div class="slider"><div class="top"><label for="light">Light intensity</label><span class="numin"><input type="number" id="lightN" min="0" max="100" step="1" value="30" aria-label="Type light intensity (%)"> %</span></div>
        <input type="range" id="light" min="0" max="100" step="1" value="30"></div>
      <div class="slider"><div class="top"><label for="co2">CO₂ level</label><span class="numin"><input type="number" id="co2N" min="0" max="1000" step="5" value="500" aria-label="Type CO₂ level (ppm)"> ppm</span></div>

  <div class="col">
    <section class="card graphcard" aria-label="Bar graph of the current set-up">

        <div class="bcol"><div class="bar b-light" id="barLight"><span class="bval" id="valLight"></span></div></div>
        <div class="bcol"><div class="bar b-temp" id="barTemp"><span class="bval" id="valTemp"></span></div></div>
        <div class="bcol"><div class="bar b-co2" id="barCO2"><span class="bval" id="valCO2"></span></div></div>
        <div class="bcol"><div class="bar b-o2" id="barO2"><span class="bval" id="valO2"></span></div></div>
      </div>
      <div class="blabels"><div>Light intensity<small>(%)</small></div><div>Temperature<small>(°C)</small></div><div>CO₂ level<small>(ppm)</small></div><div>O₂ flow<small>(mL/h)</small></div></div>
      <div class="bfoot"><button id="numBtn" aria-pressed="false">Show numerical values</button><button id="resetBtn" title="Back to 30 % light, 30 °C, 500 ppm CO₂, white light">Reset to starting set-up</button></div>
      <div class="tip">Bars above the dashed line are higher than typical. Bars below it are lower.</div>
    </section>
  </div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const mk=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;};

/* ---------- the science model (limiting factors) ----------
   The oxygen rate is held back by whichever factor is in shortest supply:
     rate = the SMALLER of  [light-limited rate]  and  [CO2-limited rate]
   Temperature sets the most the plant can do (MAX) and where light and CO2 stop helping.
   Brett's quiz values (white light):
     30 °C: start 30 % / 500 ppm = 26.1 mL/h; at 30 % light, flat from 220 ppm up, falls to 0 below;
            at 500 ppm, light stops helping at 36 %; max 31.3 mL/h first at 36 % and 270 ppm
     25 °C: max 51.8 mL/h first at 79 % light and 570 ppm
     20 °C: max 41.7 mL/h first at 50 % light and 370 ppm
   Coloured light: blue (~440 nm) and red (~675 nm) work best, green poorly (it reduces the useful light). */
const START={light:30,co2:500,temp:30,white:true,wl:450}, START_O2=26.1;
const O2_TOP30=START_O2*36/30;                        /* 31.32 mL/h, the most possible at 30 °C */
/* most oxygen possible at each temperature (mL/h); straight lines in between.
   Rises to a peak at 25 °C, then falls fast as enzymes are damaged. */
const MAX_PTS=[[0,4],[5,8],[10,16],[15,28],[20,41.7],[25,51.8],[30,O2_TOP30],[35,12],[40,3],[45,0.5]];
/* where light (%) and CO2 (ppm) stop helping, at Brett's three temperatures */
const SAT_PTS=[[20,50,370],[25,79,570],[30,36,270]];
const lerp=(P,x,k=1)=>{if(x<=P[0][0])return P[0][k];for(let i=1;i<P.length;i++)if(x<=P[i][0]){const a=P[i-1],b=P[i];return a[k]+(b[k]-a[k])*(x-a[0])/(b[0]-a[0]);}return P[P.length-1][k];};
const maxAt=T=>lerp(MAX_PTS,T);
function satAt(T){
  /* between 20 and 30 °C: straight lines between Brett's points. Outside: scale the nearest point with the max. */
  if(T>=20&&T<=30)return [lerp(SAT_PTS,T,1),lerp(SAT_PTS,T,2)];
  const e=T<20?SAT_PTS[0]:SAT_PTS[2], r=maxAt(T)/maxAt(e[0]);
  return [e[1]*r,e[2]*r];
}
/* Light curve shape (fraction of the light level-off point -> fraction of max): two straight lines
   with a bend. At 30 °C it is one straight line (so 30 % light gives exactly 26.1). At 20-25 °C it rises
   faster in dim light, so a warm-but-not-hot plant does better than at 30 °C in the same light,
   while still rising clearly (about 0.3-0.4 mL/h per %) right up to the level-off point. */
const KNEE_PTS=[[20,0.5,0.75],[25,0.4,0.75],[30,0.5,0.5]];
function lightShape(x,T){
  if(x>=1)return 1;
  const kx=lerp(KNEE_PTS,T,1), ky=lerp(KNEE_PTS,T,2);
  return x<=kx?ky*x/kx:ky+(1-ky)*(x-kx)/(1-kx);
}
/* CO2 curve shape (fraction of the CO2 level-off point -> fraction of max). At 30 °C this gives
   0 ppm -> 0, 220 ppm -> 26.1, 270 ppm -> 31.32, flat above. */
const CO2_SHAPE=[[0,0],[220/270,START_O2/O2_TOP30],[1,1]];
function trueRate(s){
  const c=s.white?1:fColour(s.wl);
  const M=maxAt(s.temp), [Ls,Cs]=satAt(s.temp);
  const lightLim=M*lightShape(s.light*c/Ls,s.temp);
  const co2Lim=M*(s.co2>=Cs?1:lerp(CO2_SHAPE,s.co2/Cs));
  return Math.min(lightLim,co2Lim);
}
const g=(x,m,s)=>Math.exp(-Math.pow((x-m)/s,2));
const fColour=w=>Math.min(1,0.95*g(w,440,38)+0.9*g(w,675,30)+0.14*g(w,560,90));
/* No random variation: the same settings always give exactly the same O2 value (used for quiz questions). */
const S={...START};
let target=0, shown=0, vol=0, simMin=0;

/* ---------- colour of light ---------- */
function wlRGB(w){
  let r=0,gg=0,b=0;
  if(w<440){r=(440-w)/60;b=1}else if(w<490){gg=(w-440)/50;b=1}else if(w<510){gg=1;b=(510-w)/20}
  else if(w<580){r=(w-510)/70;gg=1}else if(w<645){r=1;gg=(645-w)/65}else{r=1}
  let f=w<420?0.35+0.65*(w-380)/40:w>700?0.35+0.65*(750-w)/50:1;
  const c=v=>Math.round(255*Math.pow(Math.max(0,Math.min(1,v*f)),0.8));
  return `rgb(${c(r)},${c(gg)},${c(b)})`;
}
function wlName(w){return w<430?'violet':w<490?'blue':w<570?'green':w<590?'yellow':w<620?'orange':'red';}
const colourText=s=>s.white?'White':`${s.wl} nm (${wlName(s.wl)})`;

/* ---------- build the static drawing ---------- */
(function gravel(){const gEl=$('gravel');let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let i=0;i<70;i++){mk('ellipse',{cx:270+rnd()*236,cy:347-rnd()*7,rx:2.5+rnd()*3,ry:1.8+rnd()*1.6,fill:i%3?'#9C8F7D':'#B8AC98'},gEl);}})();
(function plant(){
  const p=$('plant');let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const stems=[[-24,302,-.5],[-12,288,-.2],[0,280,.05],[12,286,.25],[24,300,.5],[-5,294,-.1]];
  for(const [dx,topY,lean] of stems){
    const x0=385+dx*0.5,y0=346, x1=385+dx, y1=topY, cx=385+dx*0.2+lean*20, cy=(y0+y1)/2;
    mk('path',{d:`M${x0} ${y0} Q${cx} ${cy} ${x1} ${y1}`,stroke:'var(--stem)','stroke-width':2.2,fill:'none'},p);
    const n=Math.floor((y0-y1)/8);
    for(let i=1;i<=n;i++){
      const t=i/n, x=(1-t)*(1-t)*x0+2*(1-t)*t*cx+t*t*x1, y=(1-t)*(1-t)*y0+2*(1-t)*t*cy+t*t*y1;
      const size=1-0.35*t;
      for(let k=0;k<3;k++){
        const ang=(k===0?-55:k===1?55:(i%2?-15:15))+(rnd()*16-8)-90;
        const L=9*size, a=ang*Math.PI/180;
        const ex=x+Math.cos(a)*L/2, ey=y+Math.sin(a)*L/2;
        mk('ellipse',{cx:ex,cy:ey,rx:L/2,ry:2.1*size,transform:`rotate(${ang} ${ex} ${ey})`,fill:k===2?'var(--leaf2)':'var(--leaf)'},p);
      }
    }
    mk('circle',{cx:x1,cy:y1,r:3,fill:'var(--leaf2)'},p);
  }
})();
/* measuring tube scale: 0 mL at the top, 20 mL lower down */
const TUBE_TOP=30, TUBE_PER_ML=10, TUBE_MAX=20;
(function tubeTicks(){const t=$('tubeTicks');
  for(let m=0;m<=TUBE_MAX;m++){const y=TUBE_TOP+m*TUBE_PER_ML;const big=m%5===0;
    mk('line',{x1:399,y1:y,x2:big?390:394,y2:y,class:'tick'},t);
    if(big){const tx=mk('text',{x:403,y:y+3,class:'ticktxt'},t);tx.textContent=m;}}
  const u=mk('text',{x:403,y:TUBE_TOP+TUBE_MAX*TUBE_PER_ML+14,class:'ticktxt'},t);u.textContent='mL';})();
/* thermometer: 0 C at y=320, 50 C at y=100 */
const thY=T=>320-T*4.4;
(function thermoTicks(){const t=$('thermoTicks');
  for(let T=0;T<=50;T+=5){const y=thY(T);mk('line',{x1:474,y1:y,x2:T%10?470:467,y2:y,class:'tick'},t);
    if(T%10===0){const tx=mk('text',{x:465,y:y+3,class:'ticktxt','text-anchor':'end'},t);tx.textContent=T;}}})();

/* ---------- controls ---------- */
const light=$('light'),co2=$('co2'),temp=$('temp'),wl=$('wl');
function readControls(){S.light=+light.value;S.co2=+co2.value;S.temp=+temp.value;S.wl=+wl.value;}
function updateScene(){
  if(document.activeElement!==$('lightN'))$('lightN').value=S.light;
  if(document.activeElement!==$('co2N'))$('co2N').value=S.co2;
  if(document.activeElement!==$('tempN'))$('tempN').value=S.temp;
  $('wlO').textContent=S.white?'':`${S.wl} nm · ${wlName(S.wl)}`;
  wl.disabled=S.white;
  $('whiteBtn').setAttribute('aria-pressed',S.white);
  $('colBtn').setAttribute('aria-pressed',!S.white);
  const col=S.white?'#FFF3B0':wlRGB(S.wl);
  const on=S.light/100;
  $('beamS0').setAttribute('stop-color',col);$('beamS1').setAttribute('stop-color',col);
  $('glowS0').setAttribute('stop-color',col);$('glowS1').setAttribute('stop-color',col);
  $('beam').setAttribute('opacity',(on===0?0:0.1+0.5*on).toFixed(2));
  $('glow').setAttribute('opacity',(on===0?0:0.25+0.7*on).toFixed(2));
  $('bulb').setAttribute('fill',on===0?'#9AA3A9':(S.white?'#FFF6C8':col));
  $('filter').setAttribute('opacity',S.white?0:0.9);$('filter').setAttribute('fill',S.white?'transparent':col);
  $('filterLbl').setAttribute('opacity',S.white?0:1);
  $('heatTxt').textContent=S.temp+' °C';
  $('co2Txt').textContent=S.co2+' ppm';
  const y=thY(S.temp);$('thermo').setAttribute('y',y);$('thermo').setAttribute('height',336-y);
}
function changed(){readControls();target=trueRate(S);updateScene();drawGraph();drawO2();}
[light,co2,temp,wl].forEach(el=>el.addEventListener('input',changed));
/* typed values: update as they type (if valid), tidy up when they leave the box or press Enter */
[[light,$('lightN')],[co2,$('co2N')],[temp,$('tempN')]].forEach(([sl,box])=>{
  const max=+box.max;
  const apply=fix=>{let v=parseFloat(box.value);
    if(isNaN(v)){if(fix)box.value=sl.value;return;}
    v=Math.round(Math.max(0,Math.min(max,v))/+sl.step)*+sl.step;sl.value=v;S[sl.id]=v;
    if(fix)box.value=v;changed();};
  box.addEventListener('input',()=>apply(false));
  box.addEventListener('change',()=>apply(true));
  box.addEventListener('blur',()=>apply(true));
  box.addEventListener('keydown',e=>{if(e.key==='Enter'){apply(true);box.select();}});
});
$('whiteBtn').onclick=()=>{S.white=true;changed();};
$('colBtn').onclick=()=>{S.white=false;changed();};

/* ---------- animation: bubbles + filling tube ---------- */
const SIM_MIN_PER_SEC=2; /* 1 second on screen = 2 minutes in the lab */
const bubbles=[];const bubG=$('bubbles');let spawnAcc=0;
const leafSpots=[];$('plant').querySelectorAll('ellipse').forEach((e,i)=>{if(i%4===0)leafSpots.push([+e.getAttribute('cx'),+e.getAttribute('cy')]);});
const halfW=y=>y>=326?66:y>=250?7+(y-250)/(326-250)*59:7;
let last=performance.now();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;
  shown+= (target-shown)*Math.min(1,dt*3);
  if(Math.abs(target-shown)<0.02)shown=target;
  const full=vol>=TUBE_MAX;
  if(!full){vol=Math.min(TUBE_MAX,vol+shown*dt*SIM_MIN_PER_SEC/60);simMin+=dt*SIM_MIN_PER_SEC;}
  const gy=TUBE_TOP+vol*TUBE_PER_ML;
  $('gas').setAttribute('height',Math.max(0,gy-20));$('meniscus').setAttribute('y',gy-1);
  /* bubbles: more bubbles when the rate is higher */
  if(!reduce){
    spawnAcc+=dt*shown*0.35;
    while(spawnAcc>=1&&bubbles.length<120){spawnAcc-=1;const s=leafSpots[Math.floor(Math.random()*leafSpots.length)];
      const r=1.4+Math.random()*1.6;bubbles.push({x:s[0],y:s[1],r,v:28+Math.random()*18,el:mk('circle',{cx:s[0],cy:s[1],r,class:'bubble'},bubG)});}
    if(spawnAcc>1)spawnAcc=1;
    for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];b.y-=b.v*dt;b.x+=(Math.random()-.5)*dt*8;
      const hw=halfW(b.y)-b.r-1;if(b.x<385-hw)b.x=385-hw;if(b.x>385+hw)b.x=385+hw;
      if(b.y<gy+2||b.y<36){b.el.remove();bubbles.splice(i,1);continue;}
      b.el.setAttribute('cx',b.x.toFixed(1));b.el.setAttribute('cy',b.y.toFixed(1));}
  }
  requestAnimationFrame(frame);
}


/* ---------- bar graph ----------
   No y-axis: each bar is scaled on its own range so that the typical (moderate)
   value sits at the dashed line (half height), 0 at the bottom and the top of the
   range at full height. A bar above the line means "higher than typical". */
const TYP=0.5;
/* the starting set-up is the "typical" level, so every bar starts on the dashed line */
const O2_TYP=START_O2;
const O2_MAX=Math.max(...MAX_PTS.map(p=>p[1]));   /* best possible rate in this model (51.8 at 25 °C) */
const scaleTo=(v,typ,max)=>{v=Math.max(0,Math.min(max,v));return v<=typ?TYP*v/typ:TYP+(1-TYP)*(v-typ)/(max-typ);};
const TOP=0.9;                        /* full range fills 90% of the plot, leaving room for numbers */
$('typLine').style.bottom=(TYP*TOP*100)+'%';
const setBar=(id,f)=>{$(id).style.height=(f*TOP*100).toFixed(2)+'%';};
function drawGraph(){
  setBar('barLight',scaleTo(S.light,START.light,100));
  setBar('barTemp',scaleTo(S.temp,START.temp,45));
  setBar('barCO2',scaleTo(S.co2,START.co2,1000));
  $('valLight').textContent=S.light+' %';
  $('valTemp').textContent=S.temp+' °C';
  $('valCO2').textContent=S.co2+' ppm';
}
let lastO2=-1;
function drawO2(){
  /* the bar and number show the exact value for the current settings (no drifting or easing of the number) */
  const r=Math.round(target*10)/10;if(r===lastO2)return;lastO2=r;
  setBar('barO2',scaleTo(target,O2_TYP,O2_MAX));
  $('valO2').textContent=r.toFixed(1)+' mL/h';
}
$('resetBtn').onclick=()=>{
  light.value=START.light;co2.value=START.co2;temp.value=START.temp;wl.value=START.wl;S.white=START.white;
  vol=0;simMin=0;bubbles.forEach(b=>b.el.remove());bubbles.length=0;
  changed();shown=target;
};
$('numBtn').onclick=()=>{const on=$('plot').classList.toggle('nums');$('numBtn').setAttribute('aria-pressed',on);$('numBtn').textContent=on?'Hide numerical values':'Show numerical values';};

changed();shown=target;requestAnimationFrame(frame);
window.__photo={trueRate,S};
})();
</script>
