<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adding Forces at Angles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one laptop screen. Big animated diagram (left) + step rail with a small math card (right).
   Look: dark "night lab" stage by default for a projector, with a light whiteboard look one click away. */
:root {
  --stage: #0d1822; --stage-grid: #17283a; --rail: #111f2b; --card: #172a3a; --ink: #eef4f8; --muted: #8ba3b8;
  --line: #2a4256; --f1: #59b4ff; --f2: #ff7a59; --sum: #ffd166; --net: #6ee7a0; --glow: rgba(110, 231, 160, .35);
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
:root[data-look="light"] {
  --stage: #f7f8f4; --stage-grid: #e4e8df; --rail: #ffffff; --card: #f0f3ec; --ink: #17212b; --muted: #5c6873;
  --line: #d3d9cf; --f1: #1a5fc8; --f2: #d0452a; --sum: #b07800; --net: #12804b; --glow: rgba(18, 128, 75, .22);
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--rail); color: var(--ink); font-family: var(--body); overflow: hidden;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
* { box-sizing: border-box; }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) clamp(270px, 25vw, 360px); }

/* stage */
.stage { position: relative; background: var(--stage); min-width: 0; min-height: 0; overflow: hidden; }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.title { position: absolute; left: 22px; top: 16px; font-family: var(--display); font-weight: 700; font-size: clamp(18px, 2.2vw, 30px); letter-spacing: -0.01em; pointer-events: none; }
.title span { display: block; font-family: var(--body); font-weight: 400; font-size: 0.5em; color: var(--muted); letter-spacing: 0; margin-top: 2px; }
.caption { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: 86%; text-align: center;
  font-family: var(--display); font-weight: 700; font-size: clamp(17px, 2vw, 28px); padding: 10px 20px; border-radius: 14px;
  background: color-mix(in srgb, var(--stage) 78%, transparent); border: 1px solid var(--line); text-wrap: balance; transition: opacity .3s; }
.answer { position: absolute; right: 22px; top: 18px; padding: 12px 18px; border-radius: 14px; border: 2px solid var(--net);
  color: var(--net); font-family: var(--display); font-weight: 700; font-size: clamp(18px, 2.2vw, 30px); box-shadow: 0 0 30px var(--glow);
  background: var(--stage); opacity: 0; transform: translateY(-10px) scale(.96); transition: opacity .5s .9s, transform .5s .9s; }
.answer.on { opacity: 1; transform: none; }

/* rail */
.rail { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); padding: 14px 14px max(14px, env(safe-area-inset-bottom, 0px)); gap: 10px; }
.railhead { display: flex; justify-content: space-between; align-items: center; }
.railhead b { font-family: var(--display); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.look { font: inherit; font-size: 12px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; overflow: auto; min-height: 0; flex: 1; counter-reset: s; }
.steps button { width: 100%; text-align: left; font: inherit; font-size: clamp(14px, 1.2vw, 18px); color: var(--muted); background: none; border: 1px solid transparent;
  border-radius: 10px; padding: 8px 10px 8px 40px; cursor: pointer; position: relative; line-height: 1.25; }
.steps button::before { counter-increment: s; content: counter(s); position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
  width: 21px; height: 21px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 11.5px; font-weight: 700; }
.steps button.done { color: var(--ink); }
.steps button.done::before { background: var(--line); border-color: var(--line); color: var(--ink); }
.steps button.on { color: var(--ink); background: var(--card); border-color: var(--line); font-weight: 700; }
.steps button.on::before { background: var(--net); border-color: var(--net); color: var(--stage); }
.math { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 92px; font-variant-numeric: tabular-nums; }
.math h3 { margin: 0 0 6px; font-family: var(--display); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.math .l { font-size: clamp(14px, 1.15vw, 17px); line-height: 1.55; display: flex; flex-wrap: wrap; align-items: center; gap: 0 5px; opacity: 0; animation: up .45s ease-out forwards; }
.math .l:nth-child(3) { animation-delay: .35s; } .math .l:nth-child(4) { animation-delay: .7s; }
@keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.fr { display: inline-flex; flex-direction: column; align-items: center; font-size: .86em; line-height: 1.1; vertical-align: middle; }
.fr > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 3px 1px; } .fr > span:last-child { padding: 1px 3px 0; }
.rt { display: inline-flex; } .rt::before { content: "√"; } .rt > span { border-top: 1.5px solid currentColor; padding: 0 2px; }
.c1 { color: var(--f1); } .c2 { color: var(--f2); } .cs { color: var(--sum); } .cn { color: var(--net); } b { font-weight: 700; }
.nav { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
.nav button { font: inherit; font-weight: 700; font-size: 15px; padding: 10px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.nav button.go { background: var(--net); border-color: var(--net); color: var(--stage); }
.nav button:disabled { opacity: .4; cursor: default; }
.keys { font-size: 11.5px; color: var(--muted); text-align: center; margin: -2px 0 0; }
button:focus-visible { outline: 3px solid var(--sum); outline-offset: 2px; }

/* svg */
svg text { font-family: var(--body); fill: var(--ink); }
.grid path { stroke: var(--stage-grid); stroke-width: 1; fill: none; }
.side { stroke: var(--muted); stroke-width: 2; stroke-dasharray: 8 7; fill: none; }
.dim { fill: var(--muted); font-size: 19px; }
.chg circle { fill: var(--stage); stroke-width: 3; }
.chg.p circle { stroke: var(--f1); } .chg.n circle { stroke: var(--f2); } .chg.q circle { stroke: var(--ink); }
.chg text { font-size: 26px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.chglbl { font-size: 20px; font-weight: 700; }
.arr line { stroke-width: 6; stroke-linecap: round; }
.arr.thin line { stroke-width: 3.6; } .arr.dash line { stroke-dasharray: 9 7; stroke-linecap: butt; }
.k1 line { stroke: var(--f1); } .k1 polygon { fill: var(--f1); }
.k2 line { stroke: var(--f2); } .k2 polygon { fill: var(--f2); }
.ks line { stroke: var(--sum); } .ks polygon { fill: var(--sum); }
.kn line { stroke: var(--net); } .kn polygon { fill: var(--net); }
.kn { filter: drop-shadow(0 0 6px var(--glow)); }
.lbl { font-weight: 700; paint-order: stroke; stroke: var(--stage); stroke-width: 6px; stroke-linejoin: round; }
.t1 { fill: var(--f1); } .t2 { fill: var(--f2); } .ts { fill: var(--sum); } .tn { fill: var(--net); } .tm { fill: var(--muted); }
.axis { stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 4 5; }
.ring { fill: none; stroke: var(--f1); stroke-width: 3; opacity: 0; }
.pull { stroke: var(--f2); stroke-width: 3; stroke-dasharray: 3 12; stroke-linecap: round; fill: none; opacity: 0; }
.stage[data-step="2"] .ring { animation: ring 1.6s ease-out infinite; }
.stage[data-step="2"] .ring.r2 { animation-delay: .53s; } .stage[data-step="2"] .ring.r3 { animation-delay: 1.06s; }
@keyframes ring { 0% { opacity: .9; r: 18; } 100% { opacity: 0; r: 150; } }
.stage[data-step="3"] .pull { opacity: .9; animation: pull .9s linear infinite; }
@keyframes pull { to { stroke-dashoffset: -30; } }
.proj { stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 3 4; }
.sq { stroke-width: 1.5; }
.sqx { fill: color-mix(in srgb, var(--sum) 22%, transparent); stroke: var(--sum); }
.sqy { fill: color-mix(in srgb, var(--sum) 22%, transparent); stroke: var(--sum); }
.sqn { fill: color-mix(in srgb, var(--net) 22%, transparent); stroke: var(--net); }
.band { fill: color-mix(in srgb, var(--ink) 14%, transparent); }
.arc { fill: color-mix(in srgb, var(--net) 20%, transparent); stroke: var(--net); stroke-width: 2.5; }
.pulse { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .stage .ring, .stage .pull, .pulse { animation: none !important; } }
@media (max-width: 760px) {
  body { overflow: auto; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 62vh auto; height: auto; }
  .rail { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  ol.steps { flex: none; }
}
</style>

<div class="app">
  <section class="stage" id="stage" data-step="1">
    <svg id="svg" viewBox="-40 20 900 720" preserveAspectRatio="xMidYMid meet" aria-label="Animated force diagram"></svg>
    <div class="title">Adding Forces at Angles<span>Net electric force on Q</span></div>
    <div class="answer" id="answer">F<sub>net</sub> = 0.650 N [E 63.7° S]</div>
    <div class="caption" id="caption"></div>
  </section>
  <aside class="rail">
    <div class="railhead"><b>Steps</b><button class="look" id="look" type="button">Light board</button></div>
    <ol class="steps" id="steps"></ol>
    <div class="math"><h3>The math</h3><div id="math"></div></div>
    <div class="nav"><button id="back" type="button">Back</button><button id="next" type="button" class="go">Next</button></div>
    <p class="keys">Arrow keys or space also work</p>
  </aside>
</div>

<script>
(() => {
  // ---------- geometry (world units; 1200 px per metre for distances, 300 px per newton for forces)
  const Q = { x: 580, y: 200 }, q1 = { x: 100, y: 560 }, q2 = { x: 580, y: 560 };
  const FS = 300, cs = 0.8, sn = 0.6;
  const F1 = { x: Q.x + 0.360 * FS * cs, y: Q.y - 0.360 * FS * sn };     // (666.4, 135.2)
  const F2 = { x: Q.x, y: Q.y + 0.799 * FS };                          // (580, 439.7)
  const X1 = { x: F1.x, y: Q.y };                                      // tip of F1x
  const FY = 0.583 * FS, NET = { x: F1.x, y: Q.y + FY };
  const VB_SCENE = [-40, 20, 900, 720], VB_ZOOM = [380, 40, 620, 530];

  const STEPS = [
    { t: "The setup", c: "Three charges. What is the net force on Q?",
      m: [`Q = +2.00 μC`, `<span class="c1">q₁ = +5.00 μC</span>, 0.500 m away`, `<span class="c2">q₂ = −4.00 μC</span>, 0.300 m below`] },
    { t: "q₁ pushes Q", c: "Like charges repel: q₁ pushes Q straight away from it.",
      m: [`<span class="c1">F₁</span> = <span class="fr"><span>kq₁Q</span><span>r²</span></span> = <span class="fr"><span>(8.99×10⁹)(5.00×10⁻⁶)(2.00×10⁻⁶)</span><span>(0.500)²</span></span>`, `<b class="c1">F₁ = 0.360 N</b> [E 36.9° N]`] },
    { t: "q₂ pulls Q", c: "Opposites attract: q₂ pulls Q straight down toward it.",
      m: [`<span class="c2">F₂</span> = <span class="fr"><span>(8.99×10⁹)(4.00×10⁻⁶)(2.00×10⁻⁶)</span><span>(0.300)²</span></span>`, `<b class="c2">F₂ = 0.799 N</b> [S]`] },
    { t: "Zoom in on Q", c: "Zoom in. Only the two forces on Q matter now.",
      m: [`East is +x, north is +y.`, `We can't add 0.360 and 0.799: they point different ways.`] },
    { t: "Split F₁ into components", c: "F₁ is on an angle. Split it into its x component and y component.",
      m: [`<span class="c1">F₁ₓ</span> = 0.360 cos 36.9° = <b class="c1">+0.288 N</b>`, `<span class="c1">F₁ᵧ</span> = 0.360 sin 36.9° = <b class="c1">+0.216 N</b>`] },
    { t: "Split F₂ into components", c: "F₂ points straight down. It has no x component.",
      m: [`<span class="c2">F₂ₓ</span> = <b class="c2">0</b>`, `<span class="c2">F₂ᵧ</span> = <b class="c2">−0.799 N</b> (down is −)`] },
    { t: "Add the x components", c: "Add the x components. Only F₁ has one.",
      m: [`<span class="cs">Fₓ</span> = 0.288 + 0 = <b class="cs">+0.288 N</b>`] },
    { t: "Add the y components", c: "Add the y components tip to tail. Up and down partly cancel.",
      m: [`<span class="cs">Fᵧ</span> = 0.216 + (−0.799)`, `<b class="cs">Fᵧ = −0.583 N</b>`] },
    { t: "Rebuild tip to tail", c: "Put the two sums tip to tail. The net force closes the triangle.",
      m: [`One arrow now does the job of both forces.`] },
    { t: "Size: Pythagoras", c: "The net force is the hypotenuse: the two small squares fill the big one.",
      m: [`F<sub>net</sub> = <span class="rt"><span>Fₓ² + Fᵧ²</span></span>`, `= <span class="rt"><span>0.288² + 0.583²</span></span>`, `<b class="cn">F<sub>net</sub> = 0.650 N</b>`] },
    { t: "Direction: tangent", c: "Start facing east, then turn 63.7° toward south.",
      m: [`θ = tan⁻¹ <span class="fr"><span>opposite</span><span>adjacent</span></span> = tan⁻¹ <span class="fr"><span>0.583</span><span>0.288</span></span> = <b>63.7°</b>`, `<b class="cn">F<sub>net</sub> = 0.650 N [E 63.7° S]</b>`] },
  ];

  // ---------- markup
  const svg = document.getElementById("svg");
  const head = (x, y) => `<polygon points="0,0 -20,-9 -20,9" transform="translate(${x} ${y})"/>`;
  function arrow(id, a, b, k, extra = "") {
    return `<g id="${id}" class="arr ${k} ${extra}" data-ax="${a.x}" data-ay="${a.y}" data-bx="${b.x}" data-by="${b.y}" opacity="0">
      <line x1="${a.x}" y1="${a.y}" x2="${a.x}" y2="${a.y}"/>${head(a.x, a.y)}</g>`;
  }
  const T = (id, x, y, txt, cls, size, anchor = "middle", extra = "") =>
    `<text id="${id}" class="lbl ${cls}" x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}" opacity="0" ${extra}>${txt}</text>`;
  function grid() { let d = ""; for (let x = 0; x <= 1000; x += 40) d += `M${x} 0V700`; for (let y = 0; y <= 700; y += 40) d += `M0 ${y}H1000`; return `<g class="grid"><path d="${d}"/></g>`; }
  const charge = (id, p, s, k) => `<g id="${id}" class="chg ${k}" opacity="0"><circle cx="${p.x}" cy="${p.y}" r="22"/><text x="${p.x}" y="${p.y + 1}">${s}</text></g>`;

  const HYP = [Q, NET, { x: NET.x - FY * 0.8 * 0 - 174.9 * 1 + 0, y: NET.y + 86.4 }, { x: Q.x - 174.9, y: Q.y + 86.4 }];
  const MARKUP = `
  ${grid()}
  <g id="scene">
    <path id="tri" class="side" d="M${q1.x} ${q1.y}L${Q.x} ${Q.y}L${q2.x} ${q2.y}Z" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
    <path id="rtq" d="M${q2.x - 22} ${q2.y}v-22h22" fill="none" stroke="var(--muted)" stroke-width="1.5" opacity="0"/>
    ${T("d1", (q1.x + q2.x) / 2, q1.y + 52, "0.400 m", "tm", 21)}
    ${T("d2", q2.x + 34, (q2.y + Q.y) / 2 + 40, "0.300 m", "tm", 21, "start")}
    ${T("d3", (q1.x + Q.x) / 2 - 46, (q1.y + Q.y) / 2 - 16, "0.500 m", "tm", 21)}
    <path id="ang" d="M${q1.x + 70} ${q1.y} A70 70 0 0 0 ${q1.x + 56} ${q1.y - 42}" fill="none" stroke="var(--muted)" stroke-width="2" opacity="0"/>
    ${T("angt", q1.x + 82, q1.y - 16, "36.9°", "tm", 18, "start")}
    <circle class="ring r1" cx="${q1.x}" cy="${q1.y}" r="18" transform="rotate(0)"/>
    <circle class="ring r2" cx="${q1.x}" cy="${q1.y}" r="18"/>
    <circle class="ring r3" cx="${q1.x}" cy="${q1.y}" r="18"/>
    <path class="pull" d="M${Q.x - 26} ${Q.y + 30}L${q2.x - 26} ${q2.y - 30}"/>
    ${charge("cq1", q1, "+", "p")}${charge("cq2", q2, "−", "n")}
    ${T("lq1", q1.x, q1.y + 52, "q₁ = +5.00 μC", "t1", 21)}
    ${T("lq2", q2.x + 34, q2.y + 7, "q₂ = −4.00 μC", "t2", 21, "start")}
  </g>
  <g id="zoomgfx" opacity="0">
    <line class="axis" x1="${VB_ZOOM[0]}" y1="${Q.y}" x2="${VB_ZOOM[0] + VB_ZOOM[2]}" y2="${Q.y}"/>
    <line class="axis" x1="${Q.x}" y1="${VB_ZOOM[1]}" x2="${Q.x}" y2="${VB_ZOOM[1] + VB_ZOOM[3]}"/>
    <text class="tm" x="${VB_ZOOM[0] + VB_ZOOM[2] - 10}" y="${Q.y - 8}" font-size="14" text-anchor="end" font-weight="700">E  +x</text>
    <text class="tm" x="${Q.x - 10}" y="${Q.y - 70}" font-size="14" font-weight="700" text-anchor="end">N  +y</text>
  </g>
  <polygon id="sqn" class="sq sqn" points="${Q.x},${Q.y} ${NET.x},${NET.y} ${NET.x - 174.9},${NET.y + 86.4} ${Q.x - 174.9},${Q.y + 86.4}" opacity="0"/>
  <rect id="sqx" class="sq sqx" x="${Q.x}" y="${Q.y - 86.4}" width="86.4" height="86.4" opacity="0"/>
  <rect id="sqy" class="sq sqy" x="${X1.x}" y="${Q.y}" width="${FY}" height="${FY}" opacity="0"/>
  ${T("sqxt", Q.x + 43.2, Q.y - 38, "0.288²", "ts", 15)}
  ${T("sqyt", X1.x + FY / 2, Q.y + FY / 2 + 6, "0.583²", "ts", 19)}
  ${T("sqnt", (Q.x + NET.x - 174.9) / 2 - 4, (Q.y + NET.y + 86.4) / 2 + 6, "0.650²", "tn", 19)}
  <path id="arc" class="arc" d="" opacity="0"/>
  <path id="a1" d="M${Q.x} ${Q.y}L${Q.x + 34} ${Q.y}A34 34 0 0 0 ${Q.x + 34 * cs} ${Q.y - 34 * sn}Z" fill="color-mix(in srgb, var(--f1) 22%, transparent)" stroke="var(--f1)" stroke-width="2" opacity="0"/>
  ${T("a1t", Q.x + 37, Q.y - 6, "36.9°", "t1", 12.5, "start")}
  ${T("arct", Q.x + 64, Q.y + 52, "63.7°", "tn", 17, "start")}
  <rect id="band" class="band" x="${Q.x - 9}" y="${F1.y}" width="18" height="${Q.y - F1.y}" opacity="0"/>
  ${T("bandt", Q.x - 16, (F1.y + Q.y) / 2 + 5, "cancel", "tm", 13, "end")}
  <line id="px" class="proj" x1="${F1.x}" y1="${F1.y}" x2="${F1.x}" y2="${Q.y}" opacity="0"/>
  <path id="rt1" d="M${X1.x - 12} ${Q.y}v-12h12" fill="none" stroke="var(--muted)" stroke-width="1.4" opacity="0"/>
  ${arrow("aF1", Q, F1, "k1")}
  ${arrow("aF2", Q, F2, "k2")}
  ${arrow("aF1x", Q, X1, "k1", "thin dash")}
  ${arrow("aF1y", X1, F1, "k1", "thin dash")}
  ${arrow("aF2y", { x: Q.x + 0.01, y: Q.y }, F2, "k2", "thin dash")}
  ${arrow("aFx", Q, X1, "ks")}
  ${arrow("aFy", { x: Q.x + 30, y: Q.y }, { x: Q.x + 30, y: Q.y + FY }, "ks")}
  ${arrow("aNet", Q, NET, "kn")}
  <path id="rt2" d="M${X1.x - 14} ${Q.y}v14h14" fill="none" stroke="var(--ink)" stroke-width="1.5" opacity="0"/>
  <circle id="f2x0" cx="${Q.x}" cy="${Q.y}" r="34" fill="none" stroke="var(--f2)" stroke-width="2" stroke-dasharray="4 5" opacity="0"/>
  ${charge("cQ", Q, "+", "q")}
  ${T("lQ", Q.x - 34, Q.y - 8, "Q = +2.00 μC", "", 21, "end")}
  ${T("lF1", F1.x + 14, F1.y - 10, "F₁ = 0.360 N", "t1", 21, "start")}
  ${T("lF2", Q.x - 22, F2.y - 8, "F₂ = 0.799 N", "t2", 21, "end")}
  ${T("zF1", F1.x + 10, F1.y - 8, "F₁ = 0.360 N", "t1", 15, "start")}
  ${T("zF2", Q.x - 14, F2.y - 4, "F₂ = 0.799 N", "t2", 15, "end")}
  ${T("zF1x", (Q.x + X1.x) / 2 + 8, Q.y + 22, "+0.288", "t1", 14)}
  ${T("zF1y", F1.x + 8, (F1.y + Q.y) / 2 + 5, "+0.216", "t1", 14, "start")}
  ${T("zF2x", Q.x - 40, Q.y + 40, "x component = 0", "t2", 13, "end")}
  ${T("zF2y", Q.x + 12, F2.y - 50, "−0.799", "t2", 14, "start")}
  ${T("zFx", Q.x + 28, Q.y - 12, "Fₓ = +0.288 N", "ts", 15, "start")}
  ${T("zFy", Q.x + 40, Q.y + FY / 2 + 40, "Fᵧ = −0.583 N", "ts", 15, "start")}
  ${T("zNet", (Q.x + NET.x) / 2 - 14, (Q.y + NET.y) / 2 + 10, "F<tspan font-size='11' dy='4'>net</tspan><tspan dy='-4'> = 0.650 N</tspan>", "tn", 16, "end")}
  ${T("adj", Q.x + 28, Q.y - 32, "adjacent", "ts", 12, "start")}
  ${T("opp", X1.x + 12, Q.y + FY / 2 + 20, "opposite", "ts", 12, "start")}
  `;

  // ---------- tiny animation engine
  let token = 0;
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const $ = id => document.getElementById(id);
  function tw(dur, delay, fn, instant) {
    if (instant || matchMedia("(prefers-reduced-motion: reduce)").matches) { fn(1); return; }
    const my = token, t0 = performance.now() + delay;
    fn(0);
    const loop = now => { if (my !== token) return; const p = Math.min(1, Math.max(0, (now - t0) / dur)); fn(ease(p)); if (p < 1) requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
  const op = (id, to) => (I, d = 0, dur = 500) => { const el = $(id); const from = el.hasAttribute("opacity") ? +el.getAttribute("opacity") : 1; tw(dur, d, p => el.setAttribute("opacity", from + (to - from) * p), I); };
  function setArrow(el, ax, ay, bx, by, p) {
    const x = ax + (bx - ax) * p, y = ay + (by - ay) * p, L = Math.hypot(bx - ax, by - ay) * p;
    const ang = Math.atan2(by - ay, bx - ax) * 180 / Math.PI, back = Math.min(16, L);
    el.querySelector("line").setAttribute("x1", ax); el.querySelector("line").setAttribute("y1", ay);
    el.querySelector("line").setAttribute("x2", x - Math.cos(ang * Math.PI / 180) * back); el.querySelector("line").setAttribute("y2", y - Math.sin(ang * Math.PI / 180) * back);
    el.querySelector("polygon").setAttribute("transform", `translate(${x} ${y}) rotate(${ang})`);
    el.querySelector("polygon").setAttribute("opacity", L < 6 ? 0 : 1);
  }
  const A = el => ["ax", "ay", "bx", "by"].map(k => +el.dataset[k]);
  const grow = id => (I, d = 0, dur = 900) => { const el = $(id), [ax, ay, bx, by] = A(el); el.setAttribute("opacity", 1); tw(dur, d, p => setArrow(el, ax, ay, bx, by, p), I); };
  const slide = (id, dx, dy) => (I, d = 0, dur = 900) => {
    const el = $(id), [ax, ay, bx, by] = A(el);
    el.dataset.ax = ax + dx; el.dataset.ay = ay + dy; el.dataset.bx = bx + dx; el.dataset.by = by + dy;
    tw(dur, d, p => setArrow(el, ax + dx * p, ay + dy * p, bx + dx * p, by + dy * p, 1), I);
  };
  const camera = vb => (I, d = 0, dur = 1300) => {
    const from = svg.getAttribute("viewBox").split(" ").map(Number);
    tw(dur, d, p => svg.setAttribute("viewBox", from.map((v, i) => v + (vb[i] - v) * p).join(" ")), I);
  };
  const draw = id => (I, d = 0, dur = 1200) => { const el = $(id); tw(dur, d, p => el.setAttribute("stroke-dashoffset", 1 - p), I); };
  const pop = id => (I, d = 0, dur = 450) => { const el = $(id); const bb = el.getBBox(), cx = bb.x + bb.width / 2, cy = bb.y + bb.height / 2;
    tw(dur, d, p => { const s = 0.4 + 0.6 * p + Math.sin(p * Math.PI) * 0.15; el.setAttribute("opacity", p); el.setAttribute("transform", `translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`); }, I); };
  const arcSweep = (I, d = 0, dur = 1400) => { const el = $("arc"); el.setAttribute("opacity", 1); const r = 58;
    tw(dur, d, p => { const a = 63.7 * p * Math.PI / 180; el.setAttribute("d", `M${Q.x} ${Q.y}L${Q.x + r} ${Q.y}A${r} ${r} 0 0 1 ${Q.x + r * Math.cos(a)} ${Q.y + r * Math.sin(a)}Z`); }, I); };
  const cls = (id, c, on) => (I) => $(id).classList.toggle(c, on);

  // what each step does: [action, delay ms, duration ms]
  const DO = [
    [[draw("tri"), 200], [pop("cq1"), 0], [pop("cq2"), 150], [pop("cQ"), 300], [op("lq1", 1), 500], [op("lq2", 1), 600], [op("lQ", 1), 700],
     [op("d1", 1), 1100], [op("d2", 1), 1200], [op("d3", 1), 1300], [op("ang", 1), 1400], [op("angt", 1), 1400], [op("rtq", 1), 1400]],
    [[grow("aF1"), 700, 1000], [op("lF1", 1), 1500]],
    [[grow("aF2"), 600, 1100], [op("lF2", 1), 1500]],
    [[camera(VB_ZOOM), 100], [op("scene", 0.07), 0, 900], [op("d1", 0), 0, 400], [op("d2", 0), 0, 400], [op("d3", 0), 0, 400], [op("angt", 0), 0, 400], [op("lq1", 0), 0, 400], [op("lq2", 0), 0, 400], [op("lF1", 0), 0, 300], [op("lF2", 0), 0, 300], [op("lQ", 0), 0, 300],
     [op("zoomgfx", 1), 900], [op("zF1", 1), 1200], [op("zF2", 1), 1300], [op("a1", 1), 1500], [op("a1t", 1), 1600]],
    [[op("px", 1), 200], [grow("aF1x"), 600, 900], [op("zF1x", 1), 1400], [op("rt1", 1), 1500], [grow("aF1y"), 1700, 700], [op("zF1y", 1), 2300]],
    [[pop("f2x0"), 300, 600], [op("zF2x", 1), 700], [op("f2x0", 0), 1800, 500], [grow("aF2y"), 1100, 900], [op("zF2y", 1), 1900]],
    [[op("aF1", 0.15), 0], [op("aF2", 0.15), 0], [op("a1", 0), 0, 300], [op("a1t", 0), 0, 300], [op("zF1", 0), 0, 300], [op("zF2", 0), 0, 300], [op("px", 0), 0], [op("rt1", 0), 0],
     [op("aF1x", 0.0), 600, 400], [op("zF1x", 0), 600, 300], [op("zF2x", 0), 0, 300], [grow("aFx"), 700, 900], [op("zFx", 1), 1500]],
    [[slide("aF1y", Q.x - X1.x, 0), 100, 1000], [op("zF1y", 0), 0, 300], [op("zF2y", 0), 0, 300],
     [slide("aF2y", 0, F1.y - Q.y), 1200, 1000], [op("band", 1), 2300], [op("bandt", 1), 2300], [grow("aFy"), 2700, 1000], [op("zFy", 1), 3600]],
    [[op("aF1y", 0), 0], [op("aF2y", 0), 0], [op("band", 0), 0], [op("bandt", 0), 0], [op("aF1", 0), 0], [op("aF2", 0), 0],
     [slide("aFy", X1.x - Q.x - 30, 0), 300, 1100], [op("zFy", 0), 0, 300], [op("rt2", 1), 1400], [grow("aNet"), 1700, 1200], [op("zNet", 1), 2700],
     [cls("aNet", "pulse", true), 2900]],
    [[cls("aNet", "pulse", false), 0], [pop("sqx"), 200, 700], [op("sqxt", 1), 700], [pop("sqy"), 900, 700], [op("sqyt", 1), 1400], [pop("sqn"), 1900, 900], [op("sqnt", 1), 2700]],
    [[op("sqx", 0), 0], [op("sqy", 0), 0], [op("sqn", 0), 0], [op("sqxt", 0), 0], [op("sqyt", 0), 0], [op("sqnt", 0), 0],
     [op("adj", 1), 400], [op("opp", 1), 600], [arcSweep, 900, 1500], [op("arct", 1), 2300]],
  ];

  // ---------- run
  let step = 1;
  const stage = $("stage");
  function show(n) {
    token++;
    step = n;
    svg.innerHTML = MARKUP; svg.setAttribute("viewBox", VB_SCENE.join(" "));
    for (let i = 0; i < n - 1; i++) for (const [f] of DO[i]) f(true);
    token++;
    const delayed = [];
    for (const [f, d, dur] of DO[n - 1]) {
      // run with real timing; setTimeout keeps step order for actions that read the current state
      const my = token;
      if (!d) f(false, 0, dur); else delayed.push(setTimeout(() => { if (my === token) f(false, 0, dur); }, d));
    }
    stage.dataset.step = n;
    $("caption").textContent = STEPS[n - 1].c;
    $("answer").classList.toggle("on", n === 11);
    $("math").innerHTML = STEPS[n - 1].m.map(l => `<div class="l">${l}</div>`).join("");
    $("steps").innerHTML = STEPS.map((s, i) => `<li><button type="button" data-go="${i + 1}" class="${i + 1 === n ? "on" : i + 1 < n ? "done" : ""}" ${i + 1 === n ? 'aria-current="step"' : ""}>${s.t}</button></li>`).join("");
    $("back").disabled = n === 1; $("next").textContent = n === 11 ? "Start over" : "Next";
  }
  const next = () => show(step === 11 ? 1 : step + 1), back = () => step > 1 && show(step - 1);
  $("next").onclick = next; $("back").onclick = back;
  $("steps").onclick = e => { const b = e.target.closest("[data-go]"); if (b) show(+b.dataset.go); };
  stage.onclick = next;
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "BUTTON" && (e.key === " " || e.key === "Enter")) return;
    if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); next(); }
    if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); back(); }
  });
  let light = false;
  try { light = localStorage.getItem("faa-look") === "light"; } catch (e) {}
  const applyLook = () => { document.documentElement.dataset.look = light ? "light" : "dark"; $("look").textContent = light ? "Dark board" : "Light board"; };
  $("look").onclick = () => { light = !light; applyLook(); try { localStorage.setItem("faa-look", light ? "light" : "dark"); } catch (e) {} };
  applyLook();
  show(1);
})();
</script>

</html>
